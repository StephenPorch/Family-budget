    // Получение локальной даты в формате YYYY-MM-DD (не зависит от UTC)
    const getLocalDateString = (dateObj = new Date()) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // Получение даты со сдвигом в днях от сегодня
    const getOffsetDateString = (daysOffset) => {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      return getLocalDateString(d);
    };

    // Получение текущего месяца в формате YYYY-MM
    const getCurrentMonthPrefix = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };

    // Корректная дата внутри выбранного месяца
    const getTargetDateForMonth = (selectedMonth, preferredDay = null) => {
      const currentYm = getCurrentMonthPrefix();
      const targetYm = !selectedMonth || selectedMonth === 'all' ? currentYm : selectedMonth;
      const [y, m] = targetYm.split('-').map(Number);
      const maxDays = new Date(y, m, 0).getDate();
      if (targetYm === currentYm && !preferredDay) {
        return getLocalDateString();
      }
      const dayToUse = preferredDay
        ? Math.min(maxDays, Math.max(1, Number(preferredDay) || 1))
        : (targetYm === currentYm ? new Date().getDate() : Math.min(15, maxDays));
      return `${targetYm}-${String(dayToUse).padStart(2, '0')}`;
    };

    // Автонормализатор дат при импорте CSV и банковских выписок РФ (Сбер, Т-Банк, ВТБ, Альфа)
    // Поддерживает: YYYY-MM-DD, DD.MM.YYYY, DD/MM/YYYY, DD-MM-YYYY, DD.MM.YY, YYYY/MM/DD (+ время)
    const normalizeImportedDate = (rawStr) => {
      const fallback = getLocalDateString();
      if (!rawStr) return fallback;
      const clean = String(rawStr).trim().split(/[\sT]+/)[0];
      if (!clean) return fallback;

      // 1. Уже ISO: YYYY-MM-DD или YYYY.MM.DD или YYYY/MM/DD
      const isoMatch = clean.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);
      if (isoMatch) {
        const y = Number(isoMatch[1]);
        const m = Math.min(12, Math.max(1, Number(isoMatch[2])));
        const maxD = new Date(y, m, 0).getDate();
        const d = Math.min(maxD, Math.max(1, Number(isoMatch[3])));
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      // 2. Формат РФ: DD.MM.YYYY, DD/MM/YYYY, DD-MM-YYYY или DD.MM.YY
      const ruMatch = clean.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      if (ruMatch) {
        let y = Number(ruMatch[3]);
        if (y < 100) y += 2000;
        const m = Math.min(12, Math.max(1, Number(ruMatch[2])));
        const maxD = new Date(y, m, 0).getDate();
        const d = Math.min(maxD, Math.max(1, Number(ruMatch[1])));
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      return fallback;
    };

    // Парсинг сумм из банковских выписок ("-1 450,50 ₽", "+25 000,00")
    const parseImportedAmount = (rawVal) => {
      if (typeof rawVal === 'number') return Math.abs(rawVal);
      if (!rawVal) return 0;
      const cleaned = String(rawVal)
        .replace(/\s+/g, '')
        .replace(/,/g, '.')
        .replace(/[^0-9.-]/g, '');
      const num = parseFloat(cleaned);
      return Number.isFinite(num) ? Math.round(Math.abs(num)) : 0;
    };

    const formatCompactCellAmount = (val) => {

      if (num === 0) return '';
      if (num < 1000) return String(Math.round(num));
      if (num < 10000) {
        const k = (num / 1000).toFixed(1).replace(/\.0$/, '');
        return `${k}k`;
      }
      return `${Math.round(num / 1000)}k`;

    // Pure-JS генератор многостраничных книг OpenXML (.xlsx)
    const makeCrc32Table = () => {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[n] = c >>> 0;
      }
      return table;
    };
    const CRC_TABLE = makeCrc32Table();

    const crc32 = (bytes) => {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) {
        c = (c >>> 8) ^ CRC_TABLE[(c ^ bytes[i]) & 0xFF];
      }
      return (c ^ 0xFFFFFFFF) >>> 0;
    };

    const createZipBytes = (files) => {
      const encoder = new TextEncoder();
      const entries = files.map(f => {
        const nameBytes = encoder.encode(f.name);
        const dataBytes = typeof f.content === 'string' ? encoder.encode(f.content) : f.content;
        const crc = crc32(dataBytes);
        return { nameBytes, dataBytes, crc, offset: 0 };
      });

      let offset = 0;
      const localChunks = [];
      for (const e of entries) {
        e.offset = offset;
        const header = new Uint8Array(30 + e.nameBytes.length);
        const view = new DataView(header.buffer);
        view.setUint32(0, 0x04034b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 0x0800, true);
        view.setUint16(8, 0, true);
        view.setUint16(10, 0, true);
        view.setUint16(12, 0x554a, true);
        view.setUint32(14, e.crc, true);
        view.setUint32(18, e.dataBytes.length, true);
        view.setUint32(22, e.dataBytes.length, true);
        view.setUint16(26, e.nameBytes.length, true);
        view.setUint16(28, 0, true);
        header.set(e.nameBytes, 30);
        localChunks.push(header, e.dataBytes);
        offset += header.length + e.dataBytes.length;
      }

      const centralStart = offset;
      const centralChunks = [];
      for (const e of entries) {
        const cHeader = new Uint8Array(46 + e.nameBytes.length);
        const view = new DataView(cHeader.buffer);
        view.setUint32(0, 0x02014b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 20, true);
        view.setUint16(8, 0x0800, true);
        view.setUint16(10, 0, true);
        view.setUint16(12, 0, true);
        view.setUint16(14, 0x554a, true);
        view.setUint32(16, e.crc, true);
        view.setUint32(20, e.dataBytes.length, true);
        view.setUint32(24, e.dataBytes.length, true);
        view.setUint16(28, e.nameBytes.length, true);
        view.setUint16(30, 0, true);
        view.setUint16(32, 0, true);
        view.setUint16(34, 0, true);
        view.setUint16(36, 0, true);
        view.setUint32(38, 0, true);
        view.setUint32(42, e.offset, true);
        cHeader.set(e.nameBytes, 46);
        centralChunks.push(cHeader);
        offset += cHeader.length;
      }

      const centralSize = offset - centralStart;
      const eocd = new Uint8Array(22);
      const eView = new DataView(eocd.buffer);
      eView.setUint32(0, 0x06054b50, true);
      eView.setUint16(4, 0, true);
      eView.setUint16(6, 0, true);
      eView.setUint16(8, entries.length, true);
      eView.setUint16(10, entries.length, true);
      eView.setUint32(12, centralSize, true);
      eView.setUint32(16, centralStart, true);
      eView.setUint16(20, 0, true);

      const out = new Uint8Array(offset + 22);
      let pos = 0;
      for (const chunk of [...localChunks, ...centralChunks, eocd]) {
        out.set(chunk, pos);
        pos += chunk.length;
      }
      return out;
    };

    const xmlEscape = (str) => String(str ?? '')

    const colLetter = (idx) => {
      let s = '';
      let n = idx + 1;
      while (n > 0) {
        const r = (n - 1) % 26;
        s = String.fromCharCode(65 + r) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    };

    const buildXlsxBytes = (sheets) => {

      <Default Extension="xml" ContentType="application/xml"/>
      <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
      <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
      ${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('\n  ')}
    </Types>`;

      const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

      const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

      const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
      ${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('\n  ')}

      const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

      <cellXfs count="2">
        <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
        <xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
      </cellXfs>
      <cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
    </styleSheet>`;

      const files = [
        { name: '[Content_Types].xml', content: contentTypes },
        { name: '_rels/.rels', content: rootRels },
        { name: 'xl/workbook.xml', content: workbookXml },
        { name: 'xl/_rels/workbook.xml.rels', content: workbookRels },
        { name: 'xl/styles.xml', content: stylesXml },
      ];

      sheets.forEach((s, idx) => {
        const rowsXml = s.rows.map((row, rIdx) => {
          const cellsXml = row.map((val, cIdx) => {
            const ref = `${colLetter(cIdx)}${rIdx + 1}`;
            const styleAttr = rIdx === 0 ? ' s="1"' : '';
            if (typeof val === 'number' && Number.isFinite(val)) {
              return `<c r="${ref}"${styleAttr}><v>${val}</v></c>`;
            }
            return `<c r="${ref}" t="inlineStr"${styleAttr}><is><t>${xmlEscape(val ?? '')}</t></is></c>`;
          }).join('');
          return `<row r="${rIdx + 1}">${cellsXml}</row>`;
        }).join('\n    ');

        const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
      <cols>
        <col min="1" max="14" width="20" customWidth="1"/>
      </cols>
      <sheetData>
        ${rowsXml}
      </sheetData>
    </worksheet>`;
        files.push({ name: `xl/worksheets/sheet${idx + 1}.xml`, content: sheetXml });
      });

      return createZipBytes(files);
    };

    // ============================================================================
    // MODULE: src/utils/csv.js
    // ============================================================================
    // Экранирование и парсинг CSV (RFC 4180, разделитель `;` или `,`)
    const toCsvLine = (fields, sep = ';') => {
      return fields.map(v => {
        const s = String(v ?? '');
        if (s.includes(sep) || s.includes('"') || s.includes('\n') || s.includes('\r')) {
          return `"${s.replace(/"/g, '""')}"`;
        }
        return s;
      }).join(sep);
    };

    const parseCsvText = (text) => {
      const clean = text.replace(/^\uFEFF/, '').trim();
      if (!clean) return [];
      const firstLine = clean.split(/\r?\n/)[0] || '';
      const sep = (firstLine.split(';').length >= firstLine.split(',').length) ? ';' : ',';
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < clean.length; i++) {
        const ch = clean[i];
        if (inQuotes) {
          if (ch === '"' && clean[i + 1] === '"') {
            cur += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cur += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === sep) {
            row.push(cur);
            cur = '';
          } else if (ch === '\n' || ch === '\r') {
            if (ch === '\r' && clean[i + 1] === '\n') i++;
            row.push(cur);
            rows.push(row);
            row = [];
            cur = '';
          } else {
            cur += ch;
          }
        }
      }
      row.push(cur);
      if (row.some(c => c !== '')) rows.push(row);
      return rows;
    };

    // ============================================================================

    const getCategoryMeta = (categoryName, type, customCategories = []) => {
      const normName = (categoryName || '').trim().toLowerCase();
      const all = [...DEFAULT_EXPENSE_CATEGORIES, ...DEFAULT_INCOME_CATEGORIES, ...customCategories];
      const found = all.find(c => c.name.toLowerCase() === normName);
      if (found) return found;

      if (CATEGORY_ALIASES[normName]) {
        return CATEGORY_ALIASES[normName];
      }

      if (type === 'income') {
        return { id: 'custom_inc', name: categoryName || 'Доход', icon: '💵', color: 'bg-emerald-50 text-emerald-700' };
      }
      const isBaseWord = normName.includes('продукт') || normName.includes('дом') || normName.includes('жку') || normName.includes('связ') || normName.includes('интернет') || normName.includes('транспорт') || normName.includes('здоров') || normName.includes('дет') || normName.includes('аптек');
      return { id: 'custom_exp', name: categoryName || 'Расход', icon: '📦', color: 'bg-stone-100 text-stone-700', bucket: isBaseWord ? 'base' : 'wants' };
    };

    // Проверка: является ли операция накоплением или платежом по долгу
    const isSavingsOrDebtTx = (tx) => {
      if (!tx) return false;
      if (tx.goalId || tx.debtId) return true;
      const cat = (tx.category || '').toLowerCase();
      return cat === 'накопления' || cat === 'долги и кредиты' || cat === 'долги' || cat === 'кредиты';
    };

    // Проверка: заблокирована ли смена типа/категории (для копилок, долгов И регулярных платежей)
    const isTransactionTypeLocked = (tx) => {
      return Boolean(tx?.goalId || tx?.debtId || tx?.recurringId);
    };

    const isTransactionLockedType = isTransactionTypeLocked;

    // Чистая функция расчета безопасного дневного лимита и кассового разрыва (v0.7.5)
    const calculateSafeDailyBudget = ({
      activeBalance = 0,
      unpaidMandatoryTotal = 0,
      unpaidRecommendedTotal = 0,
      deductMandatory = true,
      deductRecommended = false,
      daysLeft = 1,
      isPastMonth = false,
    }) => {
      const reserveToDeduct =
        (deductMandatory ? unpaidMandatoryTotal : 0) +
        (deductRecommended ? unpaidRecommendedTotal : 0);
      const rawSafeBalance = activeBalance - reserveToDeduct;
      const hasCashGap = rawSafeBalance < 0;
      const cashGapAmount = hasCashGap ? Math.abs(rawSafeBalance) : 0;
      const safeBalance = Math.max(0, rawSafeBalance);
      const safeDays = Math.max(1, Number(daysLeft) || 1);
      const dailyAvailable = isPastMonth ? safeBalance : Math.max(0, Math.round(safeBalance / safeDays));

      return {
        reserveToDeduct,
        rawSafeBalance,
        hasCashGap,
        cashGapAmount,
        safeBalance,
        dailyAvailable,
      };
    };

    // Безопасное слияние (Merge) транзакций с фильтрацией дубликатов по ID и сигнатуре (v0.7.5)
    const mergeTransactions = (existingTxs = [], incomingTxs = []) => {
      const existingIds = new Set(existingTxs.map((t) => String(t.id)));
      const existingSignatures = new Set(
        existingTxs.map(
          (t) =>
            `${t.date}|${t.type}|${Math.round(Number(t.amount) || 0)}|${(t.title || '').trim().toLowerCase()}|${t.account || 'family'}`
        )
      );

      const uniqueNew = [];
      let skippedCount = 0;

      for (const tx of incomingTxs) {
        const sig = `${tx.date}|${tx.type}|${Math.round(Number(tx.amount) || 0)}|${(tx.title || '').trim().toLowerCase()}|${tx.account || 'family'}`;
        if (existingIds.has(String(tx.id)) || existingSignatures.has(sig)) {
          skippedCount++;
          continue;
        }
        existingIds.add(String(tx.id));
        existingSignatures.add(sig);
        uniqueNew.push(tx);
      }

      return {
        merged: [...uniqueNew, ...existingTxs],
        addedCount: uniqueNew.length,
        skippedCount,
      };
    };

    // Расчет остатка и срока закрытия долга/кредита
    const calculateDebtPayoff = (debt) => {
      const total = Math.max(0, Number(debt?.initialAmount ?? debt?.totalAmount) || 0);
      const rawRemaining = debt?.remainingAmount !== undefined ? Number(debt.remainingAmount) : (total - (Number(debt?.paidAmount) || 0));
      const remaining = Math.max(0, Math.min(total, Number.isFinite(rawRemaining) ? rawRemaining : total));
      const paid = Math.max(0, total - remaining);
      const isRegular = debt?.isRegular !== false;
      const monthly = isRegular ? Math.max(0, Number(debt?.monthlyPayment) || 0) : 0;
      const progressPct = total > 0 ? Math.min(100, Math.round((paid / total) * 100)) : 100;
      const monthsLeft = remaining === 0 ? 0 : (isRegular && monthly > 0) ? Math.ceil(remaining / monthly) : null;
      return { total, paid, remaining, progressPct, monthsLeft, isRegular, monthly };
    };

    // Сравнительный баланс и эффективность двух партнеров за месяц
    const calculatePartnerComparison = (transactions = [], userProfiles = {}, targetYm = getCurrentMonthPrefix()) => {
      const p1 = userProfiles.husband || { name: 'Партнер 1', emoji: '🧔🏻‍♂️' };
      const p2 = userProfiles.wife || { name: 'Партнер 2', emoji: '👩🏼' };

      let p1Income = 0;
      let p1PersonalExpense = 0;
      let p1SharedContribution = 0;

      let p2Income = 0;
      let p2PersonalExpense = 0;
      let p2SharedContribution = 0;

      let sharedPoolExpense = 0;
      let sharedPoolIncome = 0;

      for (const tx of transactions) {
        const ym = (tx.date || '').slice(0, 7);
        if (targetYm && targetYm !== 'all' && ym !== targetYm) continue;

        const amt = Math.round(Number(tx.amount) || 0);
        const author = tx.author || 'husband';
        const acc = tx.account || 'shared';

        if (tx.type === 'income') {
          if (acc === 'personal') {
            if (author === 'wife') p2Income += amt;
            else p1Income += amt;
          } else {
            sharedPoolIncome += amt;
            if (author === 'wife') p2Income += amt;
            else p1Income += amt;
          }
        } else if (tx.type === 'expense') {
          if (acc === 'personal') {
            if (author === 'wife') p2PersonalExpense += amt;
            else p1PersonalExpense += amt;
          } else {
            sharedPoolExpense += amt;
            if (author === 'wife') p2SharedContribution += amt;
            else p1SharedContribution += amt;
          }
        }
      }

      const p1TotalOut = p1PersonalExpense + p1SharedContribution;
      const p2TotalOut = p2PersonalExpense + p2SharedContribution;

      const p1Net = p1Income - p1TotalOut;
      const p2Net = p2Income - p2TotalOut;

      const p1SavingsRate = p1Income > 0 ? Math.max(0, Math.round((p1Net / p1Income) * 100)) : 0;
      const p2SavingsRate = p2Income > 0 ? Math.max(0, Math.round((p2Net / p2Income) * 100)) : 0;

      return {
        targetYm,
        partner1: {

    // Расчет прогноза переменных трат на основе предыдущих месяцев
    const calculateHistoricalForecast = (transactions = [], recurringPayments = [], targetYm = getCurrentMonthPrefix()) => {
      const recCategorySet = new Set(
        recurringPayments.filter((r) => r.isMandatory).map((r) => (r.categoryId || r.category || '').toLowerCase())
      );

      const pastMonthsSet = new Set();
      for (const tx of transactions) {
        if (tx.type !== 'expense') continue;
        const ym = (tx.date || '').slice(0, 7);
        if (ym && ym < targetYm) pastMonthsSet.add(ym);
      }
      const pastMonthsCount = Math.max(1, pastMonthsSet.size);

      const byCat = {};
      for (const tx of transactions) {
        if (tx.type !== 'expense') continue;
        const cat = tx.categoryId || tx.category || 'Прочее';
        if (recCategorySet.has(cat.toLowerCase())) continue;
        if (!byCat[cat]) byCat[cat] = { pastTotal: 0, currentSpent: 0 };
        const ym = (tx.date || '').slice(0, 7);
        if (ym === targetYm) {
          byCat[cat].currentSpent += Number(tx.amount) || 0;
        } else if (ym < targetYm) {
          byCat[cat].pastTotal += Number(tx.amount) || 0;
        }
      }

      const categories = Object.entries(byCat).map(([categoryId, stats]) => {
        const avgMonthly = Math.round(stats.pastTotal / pastMonthsCount);
        const currentSpent = Math.round(stats.currentSpent);
        const predictedRemaining = Math.max(0, avgMonthly - currentSpent);
        return {
          categoryId,
          avgMonthly,
          currentSpent,
          predictedRemaining,
        };
      });

      const totalPredictedRemaining = categories.reduce((acc, c) => acc + c.predictedRemaining, 0);
      return { categories, totalPredictedRemaining, pastMonthsCount };
    };

      if (isPaid) {
        return { code: 'paid', label: '✓ Оплачено', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200', daysDiff: 999 };
      }
      const currentYm = getCurrentMonthPrefix();
      const due = Number(rec.dueDate) || 1;
      if (targetYm < currentYm) {
        return { code: 'overdue', label: `Пропущен (${due}-е число)`, badgeClass: 'bg-rose-50 text-rose-700 border-rose-200 font-bold', daysDiff: -30 };
      }
      if (targetYm > currentYm) {
        return { code: 'planned', label: `По плану до ${due}-го`, badgeClass: 'bg-stone-100 text-stone-600 border-stone-200', daysDiff: 30 };

      const todayDay = new Date().getDate();

      if (diff < 0) {
        return { code: 'overdue', label: `Просрочен на ${Math.abs(diff)} дн. (до ${due}-го)`, badgeClass: 'bg-rose-50 text-rose-700 border-rose-200 font-bold', daysDiff: diff };

    // Хук ловушки фокуса (Focus Trap) для соблюдения стандарта доступности WCAG 2.1.2 в модальных окнах
    const useFocusTrap = (isOpen, containerRef) => {
      useEffect(() => {
        if (!isOpen || !containerRef?.current) return;

        const container = containerRef.current;
        const previouslyFocused = document.activeElement;

        const getFocusableElements = () => {
          return Array.from(
            container.querySelectorAll(
              'button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            )
          );
        };

        const handleTabKey = (e) => {
          if (e.key !== 'Tab') return;
          const focusables = getFocusableElements();
          if (focusables.length === 0) return;

          const first = focusables[0];
          const last = focusables[focusables.length - 1];

          if (e.shiftKey) {
            if (document.activeElement === first || !container.contains(document.activeElement)) {
              e.preventDefault();
              last.focus();
            }
          } else {
            if (document.activeElement === last || !container.contains(document.activeElement)) {
              e.preventDefault();
              first.focus();
            }
          }
        };

        container.addEventListener('keydown', handleTabKey);
        return () => {
          container.removeEventListener('keydown', handleTabKey);
          if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
            previouslyFocused.focus();
          }
        };
      }, [isOpen, containerRef]);
    };

    const TransactionModal = React.memo(function TransactionModal({
      isOpen,
      onClose,
      initialTx,
      presetConfig,
      currentUser,
      userProfiles,
      isLockedType,
      customCategories,
      onCreateCustomCategory,
      onDeleteCustomCategory,
      onSaveTransaction,
      onDeleteTransaction,
    }) {
      const modalRef = useRef(null);
      useFocusTrap(isOpen, modalRef);

      const [amount, setAmount] = useState('');
      const [txTitle, setTxTitle] = useState('');
      const [txType, setTxType] = useState('expense');
      const [selectedCategory, setSelectedCategory] = useState(DEFAULT_EXPENSE_CATEGORIES[0].name);
      const [selectedAccount, setSelectedAccount] = useState('shared');
      const [txAuthor, setTxAuthor] = useState('husband');
      const [txDate, setTxDate] = useState(getLocalDateString);
      const [isBatchReceiptMode, setIsBatchReceiptMode] = useState(false);

      const [isAddingCustomCategory, setIsAddingCustomCategory] = useState(false);
      const [isManagingCategories, setIsManagingCategories] = useState(false);
      const [newCatName, setNewCatName] = useState('');
      const [newCatIcon, setNewCatIcon] = useState('🏷️');
      const [newCatBucket, setNewCatBucket] = useState('base');

      useEffect(() => {
        if (!isOpen) return;
        if (initialTx) {
          setAmount(String(initialTx.amount));
          setTxTitle(initialTx.title === initialTx.category ? '' : initialTx.title);
          setTxType(initialTx.type);
          setSelectedCategory(initialTx.category);
          setSelectedAccount(initialTx.account || 'shared');
          setTxAuthor(initialTx.author || currentUser);
          setTxDate(initialTx.date || getLocalDateString());
        } else {
          setAmount('');
          setTxTitle('');
          setTxType('expense');
          setSelectedCategory(DEFAULT_EXPENSE_CATEGORIES[0].name);
          setSelectedAccount(presetConfig?.account || 'shared');
          setTxAuthor(presetConfig?.author || currentUser);
          setTxDate(presetConfig?.date || getLocalDateString());
          setIsBatchReceiptMode(Boolean(presetConfig?.batchMode));
        }
        setIsAddingCustomCategory(false);
        setIsManagingCategories(false);
      }, [isOpen, initialTx, presetConfig, currentUser]);

      const activeCategories = useMemo(() => {
        if (txType === 'income') {
          return [...DEFAULT_INCOME_CATEGORIES, ...customCategories.filter(c => c.type === 'income')];
        }
        return [...DEFAULT_EXPENSE_CATEGORIES, ...customCategories.filter(c => c.type !== 'income')];
      }, [txType, customCategories]);

      if (!isOpen) return null;

      const handleTypeSwitch = (newType) => {
        if (isLockedType) return;
        setTxType(newType);
        setIsAddingCustomCategory(false);
        if (newType === 'income') {
          const exists = [...DEFAULT_INCOME_CATEGORIES, ...customCategories.filter(c => c.type === 'income')].some(c => c.name === selectedCategory);
          if (!exists) setSelectedCategory(DEFAULT_INCOME_CATEGORIES[0].name);
        } else {
          const exists = [...DEFAULT_EXPENSE_CATEGORIES, ...customCategories.filter(c => c.type !== 'income')].some(c => c.name === selectedCategory);
          if (!exists) setSelectedCategory(DEFAULT_EXPENSE_CATEGORIES[0].name);
        }
      };

      const handleAddCategory = (e) => {
        e?.preventDefault();
        const trimmed = newCatName.trim();
        if (!trimmed) return;
        onCreateCustomCategory({
          name: trimmed,
          icon: newCatIcon.trim() || (txType === 'income' ? '💵' : '🏷️'),
          type: txType,
          bucket: txType === 'income' ? 'income' : newCatBucket,
        });
        setSelectedCategory(trimmed);
        setNewCatName('');
        setIsAddingCustomCategory(false);
      };

      const submitForm = (e, keepOpenOverride = false) => {
        e?.preventDefault();
        const num = parseFloat(amount);
        if (!num || num <= 0) return;

        const stayOpen = !initialTx && Boolean(keepOpenOverride || isBatchReceiptMode);
        onSaveTransaction({
          id: initialTx?.id || null,
          amount: num,
          title: txTitle.trim() || selectedCategory,
          type: txType,
          category: selectedCategory,
          account: selectedAccount,
          author: txAuthor,
          date: txDate || getLocalDateString(),
          stayOpen,
        });

        if (stayOpen) {
          setAmount('');
          setTxTitle('');
        }
      };

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
          className="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in"
          role="dialog"
          aria-modal="true"
          aria-labelledby="add-modal-title"
        >
          <div
            ref={modalRef}
            className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 sm:p-6 shadow-2xl border border-stone-200 max-h-[94vh] overflow-y-auto"
          >

      const [selectedDebtId, setSelectedDebtId] = useState(null);
      const [debtPayAmount, setDebtPayAmount] = useState('');
      const [debtSourceAccount, setDebtSourceAccount] = useState('shared');
      const [debtSourceAuthor, setDebtSourceAuthor] = useState('husband');
      const [debtPayDate, setDebtPayDate] = useState(getLocalDateString);

      // Редактирование планового лимита категории
      const [editingPlanCategory, setEditingPlanCategory] = useState(null);
      const [editingPlanValue, setEditingPlanValue] = useState('');

      // Поиск и компактная фильтрация
      const [searchQuery, setSearchQuery] = useState('');
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [filterAuthor, setFilterAuthor] = useState('all');
      const [filterType, setFilterType] = useState('all');
      const [filterAccount, setFilterAccount] = useState('all');

      // Система мягких уведомлений и отмены удаления (Undo Toast)
      const [toast, setToast] = useState(null); // { message, onUndo, actionLabel }
      const toastTimerRef = useRef(null);

      const showToast = useCallback((message, onUndo = null, actionLabel = 'Вернуть') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ message, onUndo, actionLabel });
        toastTimerRef.current = setTimeout(() => {
          setToast(null);
        }, 6000);
      }, []);

      // Сохранение в LocalStorage
      useEffect(() => {
        saveToStorage('family_budget_txs', transactions);
      }, [transactions]);

      useEffect(() => {
        saveToStorage('family_budget_goals', goals);
      }, [goals]);

      useEffect(() => {
        saveToStorage('family_budget_recurring', recurringPayments);
      }, [recurringPayments]);

      useEffect(() => {
        saveToStorage('family_budget_debts', debts);
      }, [debts]);

      useEffect(() => {
        saveToStorage('family_budget_profiles', userProfiles);
      }, [userProfiles]);

      useEffect(() => {
        saveToStorage('family_budget_device_owner', deviceOwner);
      }, [deviceOwner]);

      useEffect(() => {
        saveToStorage('family_budget_custom_categories', customCategories);
      }, [customCategories]);

      useEffect(() => {
        saveToStorage('family_budget_planned_limits', plannedCategoryLimits);
      }, [plannedCategoryLimits]);

      // Закрытие модальных окон по Escape
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setIsAddModalOpen(false);
            setIsGoalModalOpen(false);
            setIsNewGoalModalOpen(false);
            setIsNewRecurringModalOpen(false);
            setIsPayRecurringModalOpen(false);
            setIsNewDebtModalOpen(false);
            setIsPayDebtModalOpen(false);
            setIsProfileModalOpen(false);
            setIsExportModalOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Переключение месяца
      const stepMonth = (delta) => {
        setSelectedCalendarDate(null);
        if (selectedMonth === 'all') {
          setSelectedMonth(getCurrentMonthPrefix());
          return;
        }
        const [y, m] = selectedMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        const nextYm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        setSelectedMonth(nextYm);
      };

      // Дата окончания выбранного месяца для расчета кумулятивного остатка
      const endOfSelectedMonth = useMemo(() => {
        if (!selectedMonth || selectedMonth === 'all') return '9999-12-31';
        const [y, m] = selectedMonth.split('-').map(Number);
        const days = new Date(y, m, 0).getDate();
        return `${selectedMonth}-${String(days).padStart(2, '0')}`;
      }, [selectedMonth]);

      // Транзакции, отфильтрованные строго по выбранному месяцу
      const periodTransactions = useMemo(() => {
        const filtered = selectedMonth === 'all'
          ? transactions
          : transactions.filter(t => (t.date || '').startsWith(selectedMonth));

        return [...filtered].sort((a, b) => {
          const cmp = (b.date || '').localeCompare(a.date || '');
          if (cmp !== 0) return cmp;
          return String(b.id || '').localeCompare(String(a.id || ''));
        });
      }, [transactions, selectedMonth]);

      // Транзакции прошлого месяца для расчета авто-маркеров динамики трат
      const previousMonthTransactions = useMemo(() => {
        if (!selectedMonth || selectedMonth === 'all') return [];
        const [y, m] = selectedMonth.split('-').map(Number);
        const prevDate = new Date(y, m - 2, 1);
        const prevYm = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
        return transactions.filter(t => (t.date || '').startsWith(prevYm));
      }, [transactions, selectedMonth]);

      // Неоплаченные обязательные платежи и кредиты по кошелькам в выбранном месяце
      const mandatoryReservesByWallet = useMemo(() => {
        const targetYm = selectedMonth === 'all' ? getCurrentMonthPrefix() : selectedMonth;
        const reserves = { shared: 0, husband: 0, wife: 0, total: 0 };

        recurringPayments.forEach(r => {
          if (!r.isMandatory) return;
          if ((r.paidMonths || []).includes(targetYm)) return;
          const val = Number(r.amount) || 0;
          if ((r.account || 'shared') === 'shared') {
            reserves.shared += val;
          } else if (r.author === 'wife') {
            reserves.wife += val;
          } else {
            reserves.husband += val;
          }
          reserves.total += val;
        });

        debts.forEach(d => {
          if (d.isRegular === false) return;
          if ((Number(d.remainingAmount) || 0) <= 0) return;
          if ((d.paidMonths || []).includes(targetYm)) return;
          const val = Math.min(Number(d.remainingAmount) || 0, Number(d.monthlyPayment) || 0);
          if ((d.account || 'shared') === 'shared') {
            reserves.shared += val;
          } else if (d.author === 'wife') {
            reserves.wife += val;
          } else {
            reserves.husband += val;
          }
          reserves.total += val;
        });

        return reserves;
      }, [recurringPayments, debts, selectedMonth]);

      const unpaidMandatoryThisMonth = mandatoryReservesByWallet.total;

      // Количество ожидающих оплаты счетов и список горящих напоминаний
      const reminderSummary = useMemo(() => {
        const targetYm = selectedMonth === 'all' ? getCurrentMonthPrefix() : selectedMonth;
        const unpaidRecList = recurringPayments
          .filter(r => !(r.paidMonths || []).includes(targetYm))
          .map(r => ({ ...r, status: getRecurringReminderStatus(r, targetYm) }))
          .sort((a, b) => a.status.daysDiff - b.status.daysDiff);

        const unpaidDebtList = debts
          .filter(d => d.isRegular !== false && (Number(d.remainingAmount) || 0) > 0 && !(d.paidMonths || []).includes(targetYm));

        const urgentRecs = unpaidRecList.filter(r => r.status.code === 'overdue' || r.status.code === 'today' || r.status.code === 'soon');

        return {
          pendingCount: unpaidRecList.filter(r => r.isMandatory).length + unpaidDebtList.length,
          unpaidRecList,
          unpaidDebtList,
          urgentRecs,
        };
      }, [recurringPayments, debts, selectedMonth]);

      const pendingBillsCount = reminderSummary.pendingCount;

      // Сравнительный баланс партнеров за выбранный месяц
      const partnerComparisonData = useMemo(() => {
        return calculatePartnerComparison(transactions, userProfiles, selectedMonth);
      }, [transactions, userProfiles, selectedMonth]);

      // ================= АНАЛИЗ ПРОШЛЫХ МЕСЯЦЕВ И ПРОГНОЗ РАСХОДОВ =================
      const expenseForecastData = useMemo(() => {
        const targetYm = selectedMonth === 'all' ? getCurrentMonthPrefix() : selectedMonth;

        const pastMonthsSet = new Set();
        const historyByCatAndMonth = {};

        transactions.forEach(t => {
          if (t.type !== 'expense' || isSavingsOrDebtTx(t)) return;
          const ym = (t.date || '').slice(0, 7);
          if (!ym || ym >= targetYm) return;

          const acc = t.account || 'shared';
          const matchesWallet =
            (activeWalletCard === 'shared' && acc === 'shared') ||
            (activeWalletCard === 'husband' && acc === 'personal' && t.author === 'husband') ||
            (activeWalletCard === 'wife' && acc === 'personal' && t.author === 'wife');
          if (!matchesWallet) return;

          pastMonthsSet.add(ym);
          const cat = t.category || 'Прочее';
          if (!historyByCatAndMonth[cat]) historyByCatAndMonth[cat] = {};
          historyByCatAndMonth[cat][ym] = (historyByCatAndMonth[cat][ym] || 0) + (Number(t.amount) || 0);
        });

        const pastMonthsList = Array.from(pastMonthsSet).sort();
        const numPastMonths = Math.max(1, pastMonthsList.length);
        const prevYm = (() => {
          const [y, m] = targetYm.split('-').map(Number);
          const pd = new Date(y, m - 2, 1);
          return `${pd.getFullYear()}-${String(pd.getMonth() + 1).padStart(2, '0')}`;
        })();

        const currentActualByCat = {};
        periodTransactions.forEach(t => {
          if (t.type !== 'expense' || isSavingsOrDebtTx(t)) return;
          const acc = t.account || 'shared';
          const matchesWallet =
            (activeWalletCard === 'shared' && acc === 'shared') ||
            (activeWalletCard === 'husband' && acc === 'personal' && t.author === 'husband') ||
            (activeWalletCard === 'wife' && acc === 'personal' && t.author === 'wife');
          if (!matchesWallet) return;
          const cat = t.category || 'Прочее';
          currentActualByCat[cat] = (currentActualByCat[cat] || 0) + (Number(t.amount) || 0);
        });

        const recurringByCat = {};
        recurringPayments.forEach(r => {
          const acc = r.account || 'shared';
          const matchesWallet =
            (activeWalletCard === 'shared' && acc === 'shared') ||
            (activeWalletCard === 'husband' && acc === 'personal' && r.author === 'husband') ||
            (activeWalletCard === 'wife' && acc === 'personal' && r.author === 'wife');
          if (!matchesWallet) return;
          const cat = r.category || 'Дом и ЖКУ';
          recurringByCat[cat] = (recurringByCat[cat] || 0) + (Number(r.amount) || 0);
        });

        const allCatNames = new Set([
          ...DEFAULT_EXPENSE_CATEGORIES.filter(c => c.id !== 'savings' && c.id !== 'debts').map(c => c.name),
          ...customCategories.filter(c => c.type !== 'income').map(c => c.name),
          ...Object.keys(historyByCatAndMonth),
          ...Object.keys(currentActualByCat),
          ...Object.keys(recurringByCat),
        ]);

        const rows = [];
        let totalAutoForecast = 0;
        let totalPlannedBudget = 0;
        let totalCurrentActual = 0;

        allCatNames.forEach(catName => {
          const monthMap = historyByCatAndMonth[catName] || {};
          const totalHist = Object.values(monthMap).reduce((a, b) => a + b, 0);
          const avgHistorical = pastMonthsList.length > 0 ? Math.round(totalHist / numPastMonths) : 0;
          const prevMonthSum = monthMap[prevYm] || 0;
          const recSum = recurringByCat[catName] || 0;
          const currentActual = currentActualByCat[catName] || 0;

          const autoSuggested = Math.max(avgHistorical, recSum);
          const userCustomLimit = plannedCategoryLimits[catName];
          const effectivePlan = userCustomLimit !== undefined && userCustomLimit !== null
            ? Number(userCustomLimit)
            : autoSuggested;

          if (effectivePlan === 0 && currentActual === 0 && avgHistorical === 0 && recSum === 0) return;

          const meta = getCategoryMeta(catName, 'expense', customCategories);
          const remainingPlan = Math.max(0, effectivePlan - currentActual);
          const isOverPlan = effectivePlan > 0 && currentActual > effectivePlan;
          const pctUsed = effectivePlan > 0 ? Math.round((currentActual / effectivePlan) * 100) : (currentActual > 0 ? 100 : 0);

          totalAutoForecast += autoSuggested;
          totalPlannedBudget += effectivePlan;
          totalCurrentActual += currentActual;

          rows.push({
            category: catName,
            meta,
            avgHistorical,
            prevMonthSum,
            recSum,
            autoSuggested,
            userCustomLimit,
            effectivePlan,
            currentActual,
            remainingPlan,
            isOverPlan,
            pctUsed,
          });
        });

        rows.sort((a, b) => Math.max(b.effectivePlan, b.currentActual) - Math.max(a.effectivePlan, a.currentActual));

        return {
          rows,
          pastMonthsCount: pastMonthsList.length,
          totalAutoForecast,
          totalPlannedBudget,
          totalCurrentActual,
        };
      }, [transactions, periodTransactions, recurringPayments, customCategories, plannedCategoryLimits, selectedMonth, activeWalletCard]);

      // ================= ФИНАНСОВОЕ МАТЕМАТИЧЕСКОЕ ЯДРО v0.7.0 =================
      const stats = useMemo(() => {
        const shared = {
          income: 0,
          expense: 0,
          balance: 0,
          monthIncome: 0,
          monthExpense: 0,
          husbandIncome: 0,
          wifeIncome: 0,
          husbandConsumerSpent: 0,
          wifeConsumerSpent: 0,
          consumerExpense: 0,
          savedAndDebtPaid: 0,
        };

        const husbandPersonal = {
          income: 0,
          expense: 0,
          balance: 0,
          monthIncome: 0,
          monthExpense: 0,
          savedAndDebtPaid: 0,
        };

        const wifePersonal = {
          income: 0,
          expense: 0,
          balance: 0,
          monthIncome: 0,
          monthExpense: 0,
          savedAndDebtPaid: 0,
        };

        const categoryTotals = {};
        const prevCategoryTotals = {};

        transactions.forEach(t => {
          const txDateStr = t.date || '';
          if (txDateStr > endOfSelectedMonth) return;

          const val = Number(t.amount) || 0;
          const acc = t.account || 'shared';

          if (acc === 'shared') {
            if (t.type === 'income') shared.income += val;
            else shared.expense += val;
          } else {
            const target = t.author === 'wife' ? wifePersonal : husbandPersonal;
            if (t.type === 'income') target.income += val;
            else target.expense += val;
          }
        });

        shared.balance = shared.income - shared.expense;
        husbandPersonal.balance = husbandPersonal.income - husbandPersonal.expense;
        wifePersonal.balance = wifePersonal.income - wifePersonal.expense;

        periodTransactions.forEach(t => {
          const val = Number(t.amount) || 0;
          const acc = t.account || 'shared';
          const isSavingOrDebt = isSavingsOrDebtTx(t);

          if (acc === 'shared') {
            if (t.type === 'income') {
              shared.monthIncome += val;
              if (t.author === 'husband') shared.husbandIncome += val;
              if (t.author === 'wife') shared.wifeIncome += val;
            } else {
              shared.monthExpense += val;
              if (isSavingOrDebt) {
                shared.savedAndDebtPaid += val;
              } else {
                shared.consumerExpense += val;
                if (t.author === 'husband') shared.husbandConsumerSpent += val;
                if (t.author === 'wife') shared.wifeConsumerSpent += val;
              }
            }
          } else {
            const target = t.author === 'wife' ? wifePersonal : husbandPersonal;
            if (t.type === 'income') {
              target.monthIncome += val;
            } else {
              target.monthExpense += val;
              if (isSavingOrDebt) {
                target.savedAndDebtPaid += val;
              }
            }
          }

          const matchesWalletFilter =
            (activeWalletCard === 'shared' && acc === 'shared') ||
            (activeWalletCard === 'husband' && acc === 'personal' && t.author === 'husband') ||
            (activeWalletCard === 'wife' && acc === 'personal' && t.author === 'wife');

          if (t.type === 'expense' && matchesWalletFilter && !isSavingOrDebt) {
            const catName = t.category || 'Прочее';
            categoryTotals[catName] = (categoryTotals[catName] || 0) + val;
          }
        });

        previousMonthTransactions.forEach(t => {
          const val = Number(t.amount) || 0;
          const acc = t.account || 'shared';
          const isSavingOrDebt = isSavingsOrDebtTx(t);

          const matchesWalletFilter =
            (activeWalletCard === 'shared' && acc === 'shared') ||
            (activeWalletCard === 'husband' && acc === 'personal' && t.author === 'husband') ||
            (activeWalletCard === 'wife' && acc === 'personal' && t.author === 'wife');

          if (t.type === 'expense' && matchesWalletFilter && !isSavingOrDebt) {
            const catName = t.category || 'Прочее';
            prevCategoryTotals[catName] = (prevCategoryTotals[catName] || 0) + val;
          }
        });

        const totalSavings = goals.reduce((acc, g) => acc + (Number(g.current) || 0), 0);
        const totalTargetSavings = goals.reduce((acc, g) => acc + (Number(g.target) || 0), 0);
        const totalDebtRemaining = debts.reduce((acc, d) => acc + (Number(d.remainingAmount) || 0), 0);
        const totalDebtInitial = debts.reduce((acc, d) => acc + (Number(d.initialAmount) || 0), 0);

        const today = new Date();
        const currentYm = getCurrentMonthPrefix();
        const isPastMonth = selectedMonth !== 'all' && selectedMonth < currentYm;
        let daysLeft = 1;
        let daysInMonth = 30;

        if (selectedMonth !== 'all') {
          const [y, m] = selectedMonth.split('-').map(Number);
          daysInMonth = new Date(y, m, 0).getDate();
          if (selectedMonth === currentYm) {
            daysLeft = Math.max(1, daysInMonth - today.getDate() + 1);
          } else if (isPastMonth) {
            daysLeft = 1;
          } else {
            daysLeft = daysInMonth;
          }
        } else {
          const dim = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
          daysLeft = Math.max(1, dim - today.getDate() + 1);
          daysInMonth = dim;
        }

        const activeBalance =
          activeWalletCard === 'husband'
            ? husbandPersonal.balance
            : activeWalletCard === 'wife'
            ? wifePersonal.balance
            : shared.balance;

        const activeSavedAndDebtPaid =
          activeWalletCard === 'husband'
            ? husbandPersonal.savedAndDebtPaid
            : activeWalletCard === 'wife'
            ? wifePersonal.savedAndDebtPaid
            : shared.savedAndDebtPaid;

        const reserveToDeduct = isPastMonth
          ? 0
          : activeWalletCard === 'husband'
          ? mandatoryReservesByWallet.husband
          : activeWalletCard === 'wife'
          ? mandatoryReservesByWallet.wife
          : mandatoryReservesByWallet.shared;

        // Честный расчет кассового разрыва / дефицита (исправлен дефект скрытия отрицательного баланса)
        const rawSafeBalance = activeBalance - reserveToDeduct;
        const hasCashGap = rawSafeBalance < 0;
        const cashGapAmount = hasCashGap ? Math.abs(rawSafeBalance) : 0;
        const safeBalance = Math.max(0, rawSafeBalance);
        const dailyAvailable = isPastMonth
          ? rawSafeBalance
          : hasCashGap
          ? 0
          : Math.max(0, Math.round(safeBalance / daysLeft));

        const totalSelectedExpense = Object.values(categoryTotals).reduce((a, b) => a + b, 0);
        const hasAnyPrevMonthData = previousMonthTransactions.length > 0;
        const topCategories = Object.entries(categoryTotals)
          .sort((a, b) => b[1] - a[1])
          .map(([name, sum]) => {
            const prevSum = prevCategoryTotals[name] || 0;
            const diff = hasAnyPrevMonthData ? sum - prevSum : 0;
            return {
              name,
              sum,
              percent: totalSelectedExpense > 0 ? Math.round((sum / totalSelectedExpense) * 100) : 0,
              meta: getCategoryMeta(name, 'expense', customCategories),
              prevSum,
              diff,
              isNewInMonth: hasAnyPrevMonthData && prevSum === 0 && sum > 0,
            };
          });

        let prevMonthShortName = 'прошл. мес.';
        if (selectedMonth && selectedMonth !== 'all') {
          const [y, m] = selectedMonth.split('-').map(Number);
          const prevDate = new Date(y, m - 2, 1);
          prevMonthShortName = MONTH_NAMES_SHORT[prevDate.getMonth()];
        }

        return {
          shared,
          husbandPersonal,
          wifePersonal,
          totalSavings,
          totalTargetSavings,
          totalDebtRemaining,
          totalDebtInitial,
          dailyAvailable,
          rawSafeBalance,
          hasCashGap,
          cashGapAmount,
          safeBalance,
          reserveToDeduct,
          activeSavedAndDebtPaid,
          daysLeft,
          daysInMonth,
          isPastMonth,
          topCategories,
          totalSelectedExpense,
          unpaidMandatoryThisMonth,
          prevMonthShortName,
        };
      }, [transactions, periodTransactions, previousMonthTransactions, goals, debts, selectedMonth, endOfSelectedMonth, activeWalletCard, customCategories, mandatoryReservesByWallet, unpaidMandatoryThisMonth]);

      // Открытие модалки создания новой операции
      const openNewTransactionModal = useCallback((presetAccount = null, presetAuthor = null, presetDate = null, batchMode = false) => {
        setEditingTxId(null);
        let acc = 'shared';
        let auth = currentUser;
        if (presetAccount) {
          acc = presetAccount;
          auth = presetAuthor || currentUser;
        } else if (activeWalletCard === 'husband') {
          acc = 'personal';
          auth = 'husband';
        } else if (activeWalletCard === 'wife') {
          acc = 'personal';
          auth = 'wife';
        }
        const defaultDate = presetDate || selectedCalendarDate || getTargetDateForMonth(selectedMonth);
        setTxPresetConfig({ account: acc, author: auth, date: defaultDate, batchMode });
        setIsAddModalOpen(true);
      }, [currentUser, activeWalletCard, selectedCalendarDate, selectedMonth]);

      // Открытие модалки редактирования существующей операции
      const openEditTransactionModal = useCallback((tx) => {
        setEditingTxId(tx.id);
        setIsAddModalOpen(true);
      }, []);

      const editingTransactionObj = useMemo(() => {
        if (!editingTxId) return null;
        return transactions.find(t => t.id === editingTxId) || null;
      }, [editingTxId, transactions]);

      // Проверка блокировки типа/категории (включает goalId, debtId И recurringId — исправлен дефект аудита)
      const isEditingLockedType = useMemo(() => {
        return isTransactionTypeLocked(editingTransactionObj);
      }, [editingTransactionObj]);

      // Создание пользовательской категории
      const handleCreateCustomCategory = useCallback(({ name, icon, type, bucket }) => {
        setCustomCategories(prev => {
          if (prev.some(c => c.name.toLowerCase() === name.toLowerCase())) return prev;
          return [
            ...prev,
            {
              id: 'cat_' + Date.now(),
              name,
              icon,
              color: type === 'income' ? 'bg-emerald-50 text-emerald-700' : 'bg-stone-100 text-stone-700',
              type,
              bucket,
            },
          ];
        });
        showToast(`Категория «${name}» добавлена`);
      }, [showToast]);

      const handleDeleteCustomCategory = useCallback((e, catId) => {
        e?.stopPropagation();
        const cat = customCategories.find(c => c.id === catId);
        if (!cat) return;

        setCustomCategories(prev => prev.filter(c => c.id !== catId));
        showToast(`Категория «${cat.name}» удалена`, () => {
          setCustomCategories(prev => [...prev, cat]);
          setToast(null);
        });
      }, [customCategories, showToast]);

      // Сохранение (добавление или редактирование) транзакции без принудительного сброса выбранного месяца
      const handleSaveTransaction = useCallback((payload) => {
        const { id, amount: num, title: finalTitle, type: txType, category: selectedCategory, account: selectedAccount, author: txAuthor, date: finalDate, stayOpen } = payload;

        if (id) {
          const oldTx = transactions.find(t => t.id === id);
          const locked = isTransactionTypeLocked(oldTx);
          setTransactions(prev =>
            prev.map(t =>
              t.id === id
                ? {
                    ...t,
                    title: finalTitle,
                    amount: num,
                    type: locked ? t.type : txType,
                    category: locked ? t.category : selectedCategory,
                    account: selectedAccount,
                    author: txAuthor,
                    date: finalDate,
                  }
                : t
            )
          );

          if (oldTx && oldTx.goalId && oldTx.amount !== num) {
            const diff = num - (Number(oldTx.amount) || 0);
            const signedDiff = oldTx.type === 'income' ? -diff : diff;
            setGoals(prev =>
              prev.map(g =>
                g.id === oldTx.goalId
                  ? { ...g, current: Math.max(0, (Number(g.current) || 0) + signedDiff) }
                  : g
              )
            );
          }

          if (oldTx && oldTx.debtId && oldTx.amount !== num) {
            const diff = num - (Number(oldTx.amount) || 0);
            setDebts(prev =>
              prev.map(d =>
                d.id === oldTx.debtId
                  ? { ...d, remainingAmount: Math.max(0, (Number(d.remainingAmount) || 0) - diff) }
                  : d
              )
            );
          }

          if (oldTx && (oldTx.debtId || oldTx.recurringId)) {
            const oldYm = (oldTx.date || '').slice(0, 7);
            const newYm = finalDate.slice(0, 7);
            if (oldYm !== newYm) {
              if (oldTx.debtId) {
                const hasOtherInOld = transactions.some(
                  t => t.id !== id && t.debtId === oldTx.debtId && (t.date || '').startsWith(oldYm)
                );
                setDebts(prev =>
                  prev.map(d =>
                    d.id === oldTx.debtId
                      ? {
                          ...d,
                          paidMonths: Array.from(new Set([
                            ...(hasOtherInOld ? (d.paidMonths || []) : (d.paidMonths || []).filter(m => m !== oldYm)),
                            newYm
                          ])),
                        }
                      : d
                  )
                );
              }
              if (oldTx.recurringId) {
                const hasOtherInOld = transactions.some(
                  t => t.id !== id && t.recurringId === oldTx.recurringId && (t.date || '').startsWith(oldYm)
                );
                setRecurringPayments(prev =>
                  prev.map(r =>
                    r.id === oldTx.recurringId
                      ? {
                          ...r,
                          paidMonths: Array.from(new Set([
                            ...(hasOtherInOld ? (r.paidMonths || []) : (r.paidMonths || []).filter(m => m !== oldYm)),
                            newYm
                          ])),
                        }
                      : r
                  )
                );
              }
            }
          }

          showToast(`Операция «${finalTitle}» обновлена`);
          setEditingTxId(null);
          setIsAddModalOpen(false);
        } else {
          const newTx = {
            id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            title: finalTitle,
            amount: num,
            type: txType,
            category: selectedCategory,
            account: selectedAccount,
            author: txAuthor,
            date: finalDate,
          };
          setTransactions(prev => [newTx, ...prev]);

          const txMonth = finalDate.slice(0, 7);
          const isDifferentMonth = selectedMonth !== 'all' && txMonth !== selectedMonth;

          if (stayOpen) {
            showToast(`Чек за ${finalDate} записан (${num.toLocaleString('ru-RU')} ₽) — вводите следующий!`);
          } else {
            setEditingTxId(null);
            setIsAddModalOpen(false);
            if (isDifferentMonth) {
              showToast(
                `Чек за ${finalDate} (${num.toLocaleString('ru-RU')} ₽) добавлен в ${formatMonthTitle(txMonth)}`,
                () => {
                  setSelectedMonth(txMonth);
                  setToast(null);
                },
                `Открыть ${formatMonthTitle(txMonth)}`
              );
            } else {
              showToast(`Записано за ${finalDate}: ${finalTitle} (${num.toLocaleString('ru-RU')} ₽)`);
            }
          }
        }
      }, [transactions, selectedMonth, showToast]);

      // Удаление транзакции с мягким Undo-тостом и откатом копилки / долга
      const handleDeleteTransaction = useCallback((id, e) => {
        e?.stopPropagation();
        const index = transactions.findIndex(t => t.id === id);
        if (index === -1) return;
        const tx = transactions[index];

        setTransactions(prev => prev.filter(t => t.id !== id));

        if (tx.goalId) {
          const delta = tx.type === 'income' ? (Number(tx.amount) || 0) : -(Number(tx.amount) || 0);
          setGoals(prev =>
            prev.map(g =>
              g.id === tx.goalId
                ? { ...g, current: Math.max(0, (Number(g.current) || 0) + delta) }
                : g
            )
          );
        }

        if (tx.debtId) {
          const txMonth = (tx.date || '').slice(0, 7);
          const hasOtherThisMonth = transactions.some(
            t => t.id !== id && t.debtId === tx.debtId && (t.date || '').startsWith(txMonth)
          );
          setDebts(prev =>
            prev.map(d =>
              d.id === tx.debtId
                ? {
                    ...d,
                    remainingAmount: (Number(d.remainingAmount) || 0) + (Number(tx.amount) || 0),
                    paidMonths: hasOtherThisMonth
                      ? (d.paidMonths || [])
                      : (d.paidMonths || []).filter(m => m !== txMonth),
                  }
                : d
            )
          );
        }

        if (tx.recurringId) {
          const txMonth = (tx.date || '').slice(0, 7);
          const hasOtherThisMonth = transactions.some(
            t => t.id !== id && t.recurringId === tx.recurringId && (t.date || '').startsWith(txMonth)
          );
          setRecurringPayments(prev =>
            prev.map(r =>
              r.id === tx.recurringId
                ? {
                    ...r,
                    paidMonths: hasOtherThisMonth
                      ? (r.paidMonths || [])
                      : (r.paidMonths || []).filter(m => m !== txMonth),
                  }
                : r
            )
          );
        }

        if (editingTxId === id) {
          setIsAddModalOpen(false);
          setEditingTxId(null);
        }

        showToast(`Удалено: «${tx.title}» (${Number(tx.amount).toLocaleString('ru-RU')} ₽)`, () => {
          setTransactions(prev => {
            const copy = [...prev];
            copy.splice(index, 0, tx);
            return copy;
          });

          if (tx.goalId) {
            const restoreDelta = tx.type === 'income' ? -(Number(tx.amount) || 0) : (Number(tx.amount) || 0);
            setGoals(prev =>
              prev.map(g =>
                g.id === tx.goalId
                  ? { ...g, current: Math.max(0, (Number(g.current) || 0) + restoreDelta) }
                  : g
              )
            );
          }

          if (tx.debtId) {
            const txMonth = (tx.date || '').slice(0, 7);
            setDebts(prev =>
              prev.map(d =>
                d.id === tx.debtId
                  ? {
                      ...d,
                      remainingAmount: Math.max(0, (Number(d.remainingAmount) || 0) - (Number(tx.amount) || 0)),
                      paidMonths: Array.from(new Set([...(d.paidMonths || []), txMonth])),
                    }
                  : d
              )
            );
          }

          if (tx.recurringId) {
