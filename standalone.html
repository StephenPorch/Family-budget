    // Получение локальной даты в формате YYYY-MM-DD (не зависит от UTC)
    const getLocalDateString = (dateObj = new Date()) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // Получение даты со сдвигом в днях от сегодня
    const getOffsetDateString = (daysOffset) => {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      return getLocalDateString(d);
    };

    // Получение текущего месяца в формате YYYY-MM
    const getCurrentMonthPrefix = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };

    // Корректная дата внутри выбранного месяца
    const getTargetDateForMonth = (selectedMonth, preferredDay = null) => {
      const currentYm = getCurrentMonthPrefix();
      const targetYm = !selectedMonth || selectedMonth === 'all' ? currentYm : selectedMonth;
      const [y, m] = targetYm.split('-').map(Number);
      const maxDays = new Date(y, m, 0).getDate();
      if (targetYm === currentYm && !preferredDay) {
        return getLocalDateString();
      }
      const dayToUse = preferredDay
        ? Math.min(maxDays, Math.max(1, Number(preferredDay) || 1))
        : (targetYm === currentYm ? new Date().getDate() : Math.min(15, maxDays));
      return `${targetYm}-${String(dayToUse).padStart(2, '0')}`;
    };

    // Автонормализатор дат при импорте CSV и банковских выписок РФ (Сбер, Т-Банк, ВТБ, Альфа)
    // Поддерживает: YYYY-MM-DD, DD.MM.YYYY, DD/MM/YYYY, DD-MM-YYYY, DD.MM.YY, YYYY/MM/DD (+ время)
    const normalizeImportedDate = (rawStr) => {
      const fallback = getLocalDateString();
      if (!rawStr) return fallback;
      const clean = String(rawStr).trim().split(/[\sT]+/)[0];
      if (!clean) return fallback;

      // 1. Уже ISO: YYYY-MM-DD или YYYY.MM.DD или YYYY/MM/DD
      const isoMatch = clean.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);
      if (isoMatch) {
        const y = Number(isoMatch[1]);
        const m = Math.min(12, Math.max(1, Number(isoMatch[2])));
        const maxD = new Date(y, m, 0).getDate();
        const d = Math.min(maxD, Math.max(1, Number(isoMatch[3])));
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      // 2. Формат РФ: DD.MM.YYYY, DD/MM/YYYY, DD-MM-YYYY или DD.MM.YY
      const ruMatch = clean.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      if (ruMatch) {
        let y = Number(ruMatch[3]);
        if (y < 100) y += 2000;
        const m = Math.min(12, Math.max(1, Number(ruMatch[2])));
        const maxD = new Date(y, m, 0).getDate();
        const d = Math.min(maxD, Math.max(1, Number(ruMatch[1])));
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      return fallback;
    };

    // Парсинг сумм из банковских выписок ("-1 450,50 ₽", "+25 000,00")
    const parseImportedAmount = (rawVal) => {
      if (typeof rawVal === 'number') return Math.abs(rawVal);
      if (!rawVal) return 0;
      const cleaned = String(rawVal)
        .replace(/\s+/g, '')
        .replace(/,/g, '.')
        .replace(/[^0-9.-]/g, '');
      const num = parseFloat(cleaned);
      return Number.isFinite(num) ? Math.round(Math.abs(num)) : 0;
    };

    // Компактное форматирование суммы для узких ячеек календаря (360px)
    const formatCompactCellAmount = (val) => {
      const num = Math.abs(Number(val) || 0);
      if (num === 0) return '';
      if (num < 1000) return String(Math.round(num));
      if (num < 10000) {
        const k = (num / 1000).toFixed(1).replace(/\.0$/, '');
        return `${k}k`;
      }
      return `${Math.round(num / 1000)}k`;

    // Pure-JS генератор многостраничных книг OpenXML (.xlsx)
    const makeCrc32Table = () => {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[n] = c >>> 0;
      }
      return table;
    };
    const CRC_TABLE = makeCrc32Table();

    const crc32 = (bytes) => {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) {
        c = (c >>> 8) ^ CRC_TABLE[(c ^ bytes[i]) & 0xFF];
      }
      return (c ^ 0xFFFFFFFF) >>> 0;
    };

    const createZipBytes = (files) => {
      const encoder = new TextEncoder();
      const entries = files.map(f => {
        const nameBytes = encoder.encode(f.name);
        const dataBytes = typeof f.content === 'string' ? encoder.encode(f.content) : f.content;
        const crc = crc32(dataBytes);
        return { nameBytes, dataBytes, crc, offset: 0 };
      });

      let offset = 0;
      const localChunks = [];
      for (const e of entries) {
        e.offset = offset;
        const header = new Uint8Array(30 + e.nameBytes.length);
        const view = new DataView(header.buffer);
        view.setUint32(0, 0x04034b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 0x0800, true);
        view.setUint16(8, 0, true);
        view.setUint16(10, 0, true);
        view.setUint16(12, 0x554a, true);
        view.setUint32(14, e.crc, true);
        view.setUint32(18, e.dataBytes.length, true);
        view.setUint32(22, e.dataBytes.length, true);
        view.setUint16(26, e.nameBytes.length, true);
        view.setUint16(28, 0, true);
        header.set(e.nameBytes, 30);
        localChunks.push(header, e.dataBytes);
        offset += header.length + e.dataBytes.length;
      }

      const centralStart = offset;
      const centralChunks = [];
      for (const e of entries) {
        const cHeader = new Uint8Array(46 + e.nameBytes.length);
        const view = new DataView(cHeader.buffer);
        view.setUint32(0, 0x02014b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 20, true);
        view.setUint16(8, 0x0800, true);
        view.setUint16(10, 0, true);
        view.setUint16(12, 0, true);
        view.setUint16(14, 0x554a, true);
        view.setUint32(16, e.crc, true);
        view.setUint32(20, e.dataBytes.length, true);
        view.setUint32(24, e.dataBytes.length, true);
        view.setUint16(28, e.nameBytes.length, true);
        view.setUint16(30, 0, true);
        view.setUint16(32, 0, true);
        view.setUint16(34, 0, true);
        view.setUint16(36, 0, true);
        view.setUint32(38, 0, true);
        view.setUint32(42, e.offset, true);
        cHeader.set(e.nameBytes, 46);
        centralChunks.push(cHeader);
        offset += cHeader.length;
      }

      const centralSize = offset - centralStart;
      const eocd = new Uint8Array(22);
      const eView = new DataView(eocd.buffer);
      eView.setUint32(0, 0x06054b50, true);
      eView.setUint16(4, 0, true);
      eView.setUint16(6, 0, true);
      eView.setUint16(8, entries.length, true);
      eView.setUint16(10, entries.length, true);
      eView.setUint32(12, centralSize, true);
      eView.setUint32(16, centralStart, true);
      eView.setUint16(20, 0, true);

      const out = new Uint8Array(offset + 22);
      let pos = 0;
      for (const chunk of [...localChunks, ...centralChunks, eocd]) {
        out.set(chunk, pos);
        pos += chunk.length;
      }
      return out;
    };

    const xmlEscape = (str) => String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const colLetter = (idx) => {
      let s = '';
      let n = idx + 1;
      while (n > 0) {
        const r = (n - 1) % 26;
        s = String.fromCharCode(65 + r) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    };

    const buildXlsxBytes = (sheets) => {
      const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
      <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
      <Default Extension="xml" ContentType="application/xml"/>
      <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
      <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
      ${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('\n  ')}
    </Types>`;

      const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
      <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
    </Relationships>`;

      const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
      <sheets>
        ${sheets.map((s, i) => `<sheet name="${xmlEscape(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('\n    ')}
      </sheets>
    </workbook>`;

      const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
      ${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('\n  ')}
      <Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
    </Relationships>`;

      const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
      <fonts count="2">
        <font><sz val="11"/><name val="Calibri"/></font>
        <font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>
      </fonts>
      <fills count="3">
        <fill><patternFill patternType="none"/></fill>
        <fill><patternFill patternType="gray125"/></fill>
        <fill><patternFill patternType="solid"><fgColor rgb="FF1C1917"/></patternFill></fill>
      </fills>
      <borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
      <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
      <cellXfs count="2">
        <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
        <xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
      </cellXfs>
      <cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
    </styleSheet>`;

      const files = [
        { name: '[Content_Types].xml', content: contentTypes },
        { name: '_rels/.rels', content: rootRels },
        { name: 'xl/workbook.xml', content: workbookXml },
        { name: 'xl/_rels/workbook.xml.rels', content: workbookRels },
        { name: 'xl/styles.xml', content: stylesXml },
      ];

      sheets.forEach((s, idx) => {
        const rowsXml = s.rows.map((row, rIdx) => {
          const cellsXml = row.map((val, cIdx) => {
            const ref = `${colLetter(cIdx)}${rIdx + 1}`;
            const styleAttr = rIdx === 0 ? ' s="1"' : '';
            if (typeof val === 'number' && Number.isFinite(val)) {
              return `<c r="${ref}"${styleAttr}><v>${val}</v></c>`;
            }
            return `<c r="${ref}" t="inlineStr"${styleAttr}><is><t>${xmlEscape(val ?? '')}</t></is></c>`;
          }).join('');
          return `<row r="${rIdx + 1}">${cellsXml}</row>`;
        }).join('\n    ');

        const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
      <cols>
        <col min="1" max="14" width="20" customWidth="1"/>
      </cols>
      <sheetData>
        ${rowsXml}
      </sheetData>
    </worksheet>`;
        files.push({ name: `xl/worksheets/sheet${idx + 1}.xml`, content: sheetXml });
      });

      return createZipBytes(files);
    };

    // ============================================================================
    // MODULE: src/utils/csv.js
    // ============================================================================
    // Экранирование и парсинг CSV (RFC 4180, разделитель `;` или `,`)
    const toCsvLine = (fields, sep = ';') => {
      return fields.map(v => {
        const s = String(v ?? '');
        if (s.includes(sep) || s.includes('"') || s.includes('\n') || s.includes('\r')) {
          return `"${s.replace(/"/g, '""')}"`;
        }
        return s;
      }).join(sep);
    };

    const parseCsvText = (text) => {
      const clean = text.replace(/^\uFEFF/, '').trim();
      if (!clean) return [];
      const firstLine = clean.split(/\r?\n/)[0] || '';
      const sep = (firstLine.split(';').length >= firstLine.split(',').length) ? ';' : ',';
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < clean.length; i++) {
        const ch = clean[i];
        if (inQuotes) {
          if (ch === '"' && clean[i + 1] === '"') {
            cur += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cur += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === sep) {
            row.push(cur);
            cur = '';
          } else if (ch === '\n' || ch === '\r') {
            if (ch === '\r' && clean[i + 1] === '\n') i++;
            row.push(cur);
            rows.push(row);
            row = [];
            cur = '';
          } else {
            cur += ch;
          }
        }
      }
      row.push(cur);
      if (row.some(c => c !== '')) rows.push(row);
      return rows;
    };

    // ============================================================================

    const getCategoryMeta = (categoryName, type, customCategories = [], isOpeningBalance = false) => {
      const normName = (categoryName || '').trim().toLowerCase();
      if (isOpeningBalance || normName === 'начальный остаток') {
        return {
          id: 'opening_balance',
          name: categoryName || 'Начальный остаток',
          icon: '🏦',
          color: 'bg-sky-50 text-sky-700',
          bucket: 'opening',
        };
      }
      if (type === 'transfer' || normName === 'перевод между счетами' || normName === 'перевод') {
        return {
          id: 'transfer',
          name: categoryName || 'Перевод между счетами',
          icon: '⇄',
          color: 'bg-indigo-50 text-indigo-700',
          bucket: 'transfer',
        };
      }

      const all = [...DEFAULT_EXPENSE_CATEGORIES, ...DEFAULT_INCOME_CATEGORIES, ...customCategories];
      const found = all.find(c => c.name.toLowerCase() === normName);
      if (found) return found;

      if (CATEGORY_ALIASES[normName]) {
        return CATEGORY_ALIASES[normName];
      }

      if (type === 'income') {
        return { id: 'custom_inc', name: categoryName || 'Доход', icon: '💵', color: 'bg-emerald-50 text-emerald-700' };
      }
      const isBaseWord = normName.includes('продукт') || normName.includes('дом') || normName.includes('жку') || normName.includes('связ') || normName.includes('интернет') || normName.includes('транспорт') || normName.includes('здоров') || normName.includes('дет') || normName.includes('аптек');
      return { id: 'custom_exp', name: categoryName || 'Расход', icon: '📦', color: 'bg-stone-100 text-stone-700', bucket: isBaseWord ? 'base' : 'wants' };
    };

    // Определение ключа кошелька-источника операции ('shared' | 'husband' | 'wife')
    const getWalletKeyFromTx = (tx) => {
      if (!tx) return 'shared';
      if (tx.fromWallet === 'shared' || tx.fromWallet === 'husband' || tx.fromWallet === 'wife') {
        return tx.fromWallet;
      }
      if ((tx.account || 'shared') === 'shared') return 'shared';
      return tx.author === 'wife' ? 'wife' : 'husband';
    };

    const roundCents = (val) => Math.round(((Number(val) || 0) + Number.EPSILON) * 100) / 100;

    // Чистая функция расчета кумулятивных балансов 3 кошельков с учетом переводов (v0.8.0)
    const calculateWalletBalancesWithTransfers = (transactions = [], endOfPeriod = '9999-12-31') => {
      const wallets = {
        shared: { income: 0, expense: 0, transferIn: 0, transferOut: 0, balance: 0 },
        husband: { income: 0, expense: 0, transferIn: 0, transferOut: 0, balance: 0 },
        wife: { income: 0, expense: 0, transferIn: 0, transferOut: 0, balance: 0 },
      };

      for (const t of transactions) {
        const txDateStr = t.date || '';
        if (txDateStr > endOfPeriod) continue;
        const val = Math.max(0, Number(t.amount) || 0);
        if (val === 0) continue;

        if (t.type === 'transfer') {
          const fromW = getWalletKeyFromTx(t);
          const toW = (t.transferTo === 'shared' || t.transferTo === 'husband' || t.transferTo === 'wife')
            ? t.transferTo
            : (fromW === 'shared' ? 'husband' : 'shared');
          if (fromW !== toW) {
            wallets[fromW].transferOut += val;
            wallets[toW].transferIn += val;
          }
          continue;
        }

        const walletKey = getWalletKeyFromTx(t);
        if (t.type === 'income') {
          wallets[walletKey].income += val;
        } else {
          wallets[walletKey].expense += val;
        }
      }

      for (const k of ['shared', 'husband', 'wife']) {
        const w = wallets[k];
        w.income = roundCents(w.income);
        w.expense = roundCents(w.expense);
        w.transferIn = roundCents(w.transferIn);
        w.transferOut = roundCents(w.transferOut);
        w.balance = roundCents(w.income + w.transferIn - w.expense - w.transferOut);
      }

      return wallets;
    };

    // Проверка: является ли операция накоплением или платежом по долгу
    const isSavingsOrDebtTx = (tx) => {
      if (!tx) return false;
      if (tx.goalId || tx.debtId) return true;
      const cat = (tx.category || '').toLowerCase();
      return cat === 'накопления' || cat === 'долги и кредиты' || cat === 'долги' || cat === 'кредиты';
    };

    // Проверка: заблокирована ли смена типа/категории (для копилок, долгов И регулярных платежей)
    const isTransactionTypeLocked = (tx) => {
      return Boolean(tx?.goalId || tx?.debtId || tx?.recurringId);
    };

    const isTransactionLockedType = isTransactionTypeLocked;

    // Расчет количества дней горизонта безопасного лимита (по умолчанию: до ближайшей выплаты ЗП/аванса)
    const calculateHorizonDays = (config = DEFAULT_SAFE_LIMIT_CONFIG, today = new Date(), options = {}) => {
      const current = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const mode = config?.mode || 'paydays';

      if (mode === 'paydays') {
        const rawDays = Array.isArray(config?.paydays) ? config.paydays : [10, 25];
        const cleanDays = Array.from(new Set(rawDays.map(Number).filter(d => d >= 1 && d <= 31))).sort((a, b) => a - b);
        if (cleanDays.length === 0) {
          cleanDays.push(10, 25);
        }

        const currentYear = current.getFullYear();
        const currentMonth = current.getMonth();
        const currentDay = current.getDate();
        const daysInThisMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const isPaydayToday = cleanDays.some(d => Math.min(d, daysInThisMonth) === currentDay);

        if (isPaydayToday && options?.waitForSalaryOnPayday && !options?.hasSalaryToday) {
          const monthShortToday = ['янв.', 'февр.', 'марта', 'апр.', 'мая', 'июня', 'июля', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'][currentMonth];
          return {
            days: 1,
            label: `сегодня день ЗП (${currentDay} ${monthShortToday})`,
            targetDate: current,
            isPaydayToday: true,
          };
        }

        let targetDate = null;
        for (const d of cleanDays) {
          const validDay = Math.min(d, daysInThisMonth);
          if (validDay > currentDay) {
            targetDate = new Date(currentYear, currentMonth, validDay);
            break;
          }
        }

        if (!targetDate) {
          const nextMonthYear = currentMonth === 11 ? currentYear + 1 : currentYear;
          const nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
          const daysInNextMonth = new Date(nextMonthYear, nextMonth + 1, 0).getDate();
          const validDay = Math.min(cleanDays[0], daysInNextMonth);
          targetDate = new Date(nextMonthYear, nextMonth, validDay);
        }

        const diffMs = targetDate.getTime() - current.getTime();
        const diffDays = Math.max(1, Math.round(diffMs / (1000 * 60 * 60 * 24)));

        const monthShort = ['янв.', 'февр.', 'марта', 'апр.', 'мая', 'июня', 'июля', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'][targetDate.getMonth()];
        const label = `до ЗП (${targetDate.getDate()} ${monthShort})`;

        return {
          days: diffDays,
          label,
          targetDate,
          isPaydayToday,
        };
      }

      if (mode === 'month') {
        const dim = new Date(current.getFullYear(), current.getMonth() + 1, 0).getDate();
        const diffDays = Math.max(1, dim - current.getDate() + 1);
        return {
          days: diffDays,
          label: 'до конца месяца',
          targetDate: new Date(current.getFullYear(), current.getMonth(), dim),
          isPaydayToday: false,
        };
      }

      if (mode === 'days') {
        const d = Math.max(1, Math.min(365, Number(config?.fixedDays) || 14));
        const target = new Date(current);
        target.setDate(target.getDate() + d);
        return {
          days: d,
          label: `на ${d} дн.`,
          targetDate: target,
          isPaydayToday: false,
        };
      }

      if (mode === 'end_of_year') {
        const endOfYear = new Date(current.getFullYear(), 11, 31);
        const diffMs = endOfYear.getTime() - current.getTime();
        const diffDays = Math.max(1, Math.round(diffMs / (1000 * 60 * 60 * 24)) + 1);
        return {
          days: diffDays,
          label: `до конца ${current.getFullYear()} г.`,
          targetDate: endOfYear,
          isPaydayToday: false,
        };
      }

      return {
        days: 14,
        label: 'на 14 дн.',
        targetDate: null,
        isPaydayToday: false,
      };
    };

    // Чистая функция расчета безопасного дневного лимита и кассового разрыва
    const calculateSafeDailyBudget = ({
      activeBalance = 0,
      unpaidMandatoryTotal = 0,
      unpaidRecommendedTotal = 0,
      deductMandatory = true,
      deductRecommended = false,
      daysLeft = 1,
      isPastMonth = false,
    }) => {
      const reserveToDeduct =
        (deductMandatory ? unpaidMandatoryTotal : 0) +
        (deductRecommended ? unpaidRecommendedTotal : 0);
      const rawSafeBalance = activeBalance - reserveToDeduct;
      const hasCashGap = rawSafeBalance < 0;
      const cashGapAmount = hasCashGap ? Math.abs(rawSafeBalance) : 0;
      const safeBalance = Math.max(0, rawSafeBalance);
      const safeDays = Math.max(1, Number(daysLeft) || 1);
      const dailyAvailable = isPastMonth ? safeBalance : Math.max(0, Math.round(safeBalance / safeDays));

      return {
        reserveToDeduct,
        rawSafeBalance,
        hasCashGap,
        cashGapAmount,
        safeBalance,
        dailyAvailable,
      };
    };

    const normAccountForSig = (acc) => (!acc || acc === 'family') ? 'shared' : acc;

    const getTxSignature = (tx) => {
      const fromW = tx.fromWallet || '';
      const toW = tx.transferTo || '';
      const openingFlag = tx.isOpeningBalance ? 'opening' : '';
      return `${tx.date}|${tx.type}|${Math.round(Number(tx.amount) || 0)}|${(tx.title || '').trim().toLowerCase()}|${normAccountForSig(tx.account)}|${fromW}|${toW}|${openingFlag}`;
    };

    // Безопасное слияние (Merge) транзакций с фильтрацией дубликатов по ID и сигнатуре
    const mergeTransactions = (existingTxs = [], incomingTxs = []) => {
      const existingIds = new Set(existingTxs.map((t) => String(t.id)));
      const existingSignatures = new Set(existingTxs.map(getTxSignature));

      const uniqueNew = [];
      let skippedCount = 0;

      for (const tx of incomingTxs) {
        const sig = getTxSignature(tx);
        if (existingIds.has(String(tx.id)) || existingSignatures.has(sig)) {
          skippedCount++;
          continue;
        }
        existingIds.add(String(tx.id));
        existingSignatures.add(sig);
        uniqueNew.push(tx);
      }

      return {
        merged: [...uniqueNew, ...existingTxs],
        addedCount: uniqueNew.length,
        skippedCount,
      };
    };

    // Расчет остатка и срока закрытия долга/кредита
    const calculateDebtPayoff = (debt) => {
      const total = Math.max(0, Number(debt?.initialAmount ?? debt?.totalAmount) || 0);
      const rawRemaining = debt?.remainingAmount !== undefined ? Number(debt.remainingAmount) : (total - (Number(debt?.paidAmount) || 0));
      const remaining = Math.max(0, Math.min(total, Number.isFinite(rawRemaining) ? rawRemaining : total));
      const paid = Math.max(0, total - remaining);
      const isRegular = debt?.isRegular !== false;
      const monthly = isRegular ? Math.max(0, Number(debt?.monthlyPayment) || 0) : 0;
      const progressPct = total > 0 ? Math.min(100, Math.round((paid / total) * 100)) : 100;
      const monthsLeft = remaining === 0 ? 0 : (isRegular && monthly > 0) ? Math.ceil(remaining / monthly) : null;
      return { total, paid, remaining, progressPct, monthsLeft, isRegular, monthly };
    };

    // Сравнительный баланс и эффективность двух партнеров за месяц (без двойного счета трат из пополненного резерва)
    const calculatePartnerComparison = (transactions = [], userProfiles = {}, targetYm = getCurrentMonthPrefix()) => {
      const profiles = (userProfiles && typeof userProfiles === 'object') ? userProfiles : {};
      const p1 = profiles.husband || { name: 'Партнер 1', emoji: '🧔🏻‍♂️' };
      const p2 = profiles.wife || { name: 'Партнер 2', emoji: '👩🏼' };

      let p1PersonalIncome = 0;
      let p1SharedDirectIncome = 0;
      let p1PersonalExpense = 0;
      let p1TransferToShared = 0;
      let p1TransferFromShared = 0;
      let p1SharedSpent = 0;

      let p2PersonalIncome = 0;
      let p2SharedDirectIncome = 0;
      let p2PersonalExpense = 0;
      let p2TransferToShared = 0;
      let p2TransferFromShared = 0;
      let p2SharedSpent = 0;

      let sharedPoolExpense = 0;
      let sharedPoolIncome = 0;
      let sharedPoolTransferOut = 0;

      for (const tx of transactions) {
        if (tx.isOpeningBalance) continue;
        const ym = (tx.date || '').slice(0, 7);
        if (targetYm && targetYm !== 'all' && ym !== targetYm) continue;

        const amt = Math.round(Number(tx.amount) || 0);
        const author = tx.author || 'husband';
        const acc = tx.account || 'shared';

        if (tx.type === 'transfer') {
          const fromW = getWalletKeyFromTx(tx);
          const toW = (tx.transferTo === 'shared' || tx.transferTo === 'husband' || tx.transferTo === 'wife')
            ? tx.transferTo
            : (fromW === 'shared' ? 'husband' : 'shared');
          if (fromW === 'husband' && toW === 'shared') {
            p1TransferToShared += amt;
            sharedPoolIncome += amt;
          } else if (fromW === 'wife' && toW === 'shared') {
            p2TransferToShared += amt;
            sharedPoolIncome += amt;
          } else if (fromW === 'shared' && toW === 'husband') {
            p1TransferFromShared += amt;
            sharedPoolTransferOut += amt;
          } else if (fromW === 'shared' && toW === 'wife') {
            p2TransferFromShared += amt;
            sharedPoolTransferOut += amt;
          }
          continue;
        }

        if (tx.type === 'income') {
          if (acc === 'personal') {
            if (author === 'wife') p2PersonalIncome += amt;
            else p1PersonalIncome += amt;
          } else {
            sharedPoolIncome += amt;
            if (author === 'wife') p2SharedDirectIncome += amt;
            else p1SharedDirectIncome += amt;
          }
        } else if (tx.type === 'expense') {
          if (acc === 'personal') {
            if (author === 'wife') p2PersonalExpense += amt;
            else p1PersonalExpense += amt;
          } else {
            sharedPoolExpense += amt;
            if (author === 'wife') p2SharedSpent += amt;
            else p1SharedSpent += amt;
          }
        }
      }

      const p1Income = p1PersonalIncome + p1SharedDirectIncome;
      const p2Income = p2PersonalIncome + p2SharedDirectIncome;

      const totalSharedInflow = p1SharedDirectIncome + p2SharedDirectIncome + p1TransferToShared + p2TransferToShared;
      const p1SharedContribution = totalSharedInflow > 0
        ? Math.max(0, p1SharedDirectIncome + p1TransferToShared - p1TransferFromShared)
        : p1SharedSpent;
      const p2SharedContribution = totalSharedInflow > 0
        ? Math.max(0, p2SharedDirectIncome + p2TransferToShared - p2TransferFromShared)
        : p2SharedSpent;

      const p1TotalOut = p1PersonalExpense + p1SharedContribution;
      const p2TotalOut = p2PersonalExpense + p2SharedContribution;

      const p1Net = p1Income - p1TotalOut;
      const p2Net = p2Income - p2TotalOut;

      const p1SavingsRate = p1Income > 0 ? Math.max(0, Math.round((p1Net / p1Income) * 100)) : 0;
      const p2SavingsRate = p2Income > 0 ? Math.max(0, Math.round((p2Net / p2Income) * 100)) : 0;

      return {
        targetYm,
        partner1: {
          id: 'husband',
          name: p1.name || 'Партнер 1',
          emoji: p1.emoji || '🧔🏻‍♂️',
          income: p1Income,
          personalExpense: p1PersonalExpense,
          sharedContribution: p1SharedContribution,
          sharedSpent: p1SharedSpent,
          totalOut: p1TotalOut,
          net: p1Net,
          savingsRate: p1SavingsRate,
        },
        partner2: {
          id: 'wife',
          name: p2.name || 'Партнер 2',
          emoji: p2.emoji || '👩🏼',
          income: p2Income,
          personalExpense: p2PersonalExpense,
          sharedContribution: p2SharedContribution,
          sharedSpent: p2SharedSpent,
          totalOut: p2TotalOut,
          net: p2Net,
          savingsRate: p2SavingsRate,
        },
        sharedPool: {
          totalIncome: sharedPoolIncome,
          totalExpense: sharedPoolExpense,
          transferOut: sharedPoolTransferOut,
        },
      };
    };

    // Расчет прогноза переменных трат на основе предыдущих месяцев
    const calculateHistoricalForecast = (transactions = [], recurringPayments = [], targetYm = getCurrentMonthPrefix()) => {
      const recCategorySet = new Set(
        recurringPayments.filter((r) => r.isMandatory).map((r) => (r.categoryId || r.category || '').toLowerCase())
      );

      const pastMonthsSet = new Set();
      for (const tx of transactions) {
        if (tx.type !== 'expense' || tx.isOpeningBalance) continue;
        const ym = (tx.date || '').slice(0, 7);
        if (ym && ym < targetYm) pastMonthsSet.add(ym);
      }
      const pastMonthsCount = Math.max(1, pastMonthsSet.size);

      const byCat = {};
      for (const tx of transactions) {
        if (tx.type !== 'expense' || tx.isOpeningBalance) continue;
        const cat = tx.categoryId || tx.category || 'Прочее';
        if (recCategorySet.has(cat.toLowerCase())) continue;
        if (!byCat[cat]) byCat[cat] = { pastTotal: 0, currentSpent: 0 };
        const ym = (tx.date || '').slice(0, 7);
        if (ym === targetYm) {
          byCat[cat].currentSpent += Number(tx.amount) || 0;
        } else if (ym < targetYm) {
          byCat[cat].pastTotal += Number(tx.amount) || 0;
        }
      }

      const categories = Object.entries(byCat).map(([categoryId, stats]) => {
        const avgMonthly = Math.round(stats.pastTotal / pastMonthsCount);
        const currentSpent = Math.round(stats.currentSpent);
        const predictedRemaining = Math.max(0, avgMonthly - currentSpent);
        return {
          categoryId,
          avgMonthly,
          currentSpent,
          predictedRemaining,
        };
      });

      const totalPredictedRemaining = categories.reduce((acc, c) => acc + c.predictedRemaining, 0);
      return { categories, totalPredictedRemaining, pastMonthsCount };
    };

    // Определение статуса напоминалки для регулярного платежа
    const getRecurringReminderStatus = (rec, targetYm) => {
      const isPaid = (rec.paidMonths || []).includes(targetYm);
      if (isPaid) {
        return { code: 'paid', label: '✓ Оплачено', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200', daysDiff: 999 };
      }
      const currentYm = getCurrentMonthPrefix();
      const due = Number(rec.dueDate) || 1;
      if (targetYm < currentYm) {
        return { code: 'overdue', label: `Пропущен (${due}-е число)`, badgeClass: 'bg-rose-50 text-rose-700 border-rose-200 font-bold', daysDiff: -30 };
      }
      if (targetYm > currentYm) {
        return { code: 'planned', label: `По плану до ${due}-го`, badgeClass: 'bg-stone-100 text-stone-600 border-stone-200', daysDiff: 30 };
      }
      const todayDay = new Date().getDate();
      const diff = due - todayDay;
      if (diff < 0) {
        return { code: 'overdue', label: `Просрочен на ${Math.abs(diff)} дн. (до ${due}-го)`, badgeClass: 'bg-rose-50 text-rose-700 border-rose-200 font-bold', daysDiff: diff };
      }
      if (diff === 0) {
        return { code: 'today', label: `Оплата сегодня (${due}-е число)!`, badgeClass: 'bg-amber-100 text-amber-900 border-amber-300 font-bold', daysDiff: 0 };
      }
      if (diff <= 5) {
        return { code: 'soon', label: `Скоро: через ${diff} дн. (до ${due}-го)`, badgeClass: 'bg-amber-50 text-amber-800 border-amber-200 font-semibold', daysDiff: diff };
      }
      return { code: 'upcoming', label: `До ${due}-го числа (через ${diff} дн.)`, badgeClass: 'bg-stone-100 text-stone-600 border-stone-200', daysDiff: diff };
    };

    // ============================================================================
    // MODULE: src/utils/exportImport.js
    // ============================================================================
    const getProfileDisplayName = (safeProfiles, key) => {
      if (key === 'wife') return safeProfiles?.wife?.name || 'Партнер 2';
      return safeProfiles?.husband?.name || 'Партнер 1';
    };

    const getWalletDisplayLabel = (safeProfiles, wKey) => {
      if (wKey === 'husband') return getProfileDisplayName(safeProfiles, 'husband');
      if (wKey === 'wife') return getProfileDisplayName(safeProfiles, 'wife');
      return 'Общий котел';
    };

    const mergeUniqueByIdOrKey = (existingList, incomingList, getKey) => {
      const map = new Map();
      const keySet = new Set();
      existingList.forEach(item => {
        map.set(item.id, item);
        if (getKey) keySet.add(getKey(item));
      });
      incomingList.forEach(item => {
        const k = getKey ? getKey(item) : null;
        if (!map.has(item.id) && (!k || !keySet.has(k))) {
          map.set(item.id, item);
          if (k) keySet.add(k);
        }
      });
      return Array.from(map.values());
    };

    const buildBudgetXlsxSheets = ({
      selectedMonth,
      stats,
      pendingBillsCount,
      transactions,
      expenseForecastData,
      recurringPayments,
      goals,
      debts,
      safeProfiles,
    }) => {
      const targetYm = selectedMonth === 'all' ? getCurrentMonthPrefix() : selectedMonth;
      const p1Name = getProfileDisplayName(safeProfiles, 'husband');
      const p2Name = getProfileDisplayName(safeProfiles, 'wife');

      const summaryRows = [
        ['Показатель', 'Значение (₽ / %)', 'Период / Комментарий'],
        ['Версия приложения', `v${APP_VERSION}`, `Дата выгрузки: ${getLocalDateString()}`],
        ['Выбранный период', formatMonthTitle(selectedMonth), targetYm],
        ['Кумулятивный баланс: Общий котел', stats.shared.balance, `Доходы мес: +${stats.shared.monthIncome} / Расходы мес: -${stats.shared.monthExpense}`],
        [`Кумулятивный баланс: Личный (${p1Name})`, stats.husbandPersonal.balance, `Доходы мес: +${stats.husbandPersonal.monthIncome} / Расходы мес: -${stats.husbandPersonal.monthExpense}`],
        [`Кумулятивный баланс: Личный (${p2Name})`, stats.wifePersonal.balance, `Доходы мес: +${stats.wifePersonal.monthIncome} / Расходы мес: -${stats.wifePersonal.monthExpense}`],
        ['Потребительские расходы (Общий котел)', stats.shared.consumerExpense, 'Без учета копилок и кредитов'],
        ['Отложено в копилки и погашено долгов', stats.shared.savedAndDebtPaid, 'Из общего котла за выбранный период'],
        ['Резерв на неоплаченные обязательные счета', stats.unpaidMandatoryThisMonth, `Ожидает оплаты счетов: ${pendingBillsCount}`],
        ['Безопасный дневной лимит (активный счет)', stats.dailyAvailable, stats.hasCashGap ? `Кассовый разрыв: -${stats.cashGapAmount} ₽` : `На ${stats.daysLeft} дн.`],
        ['Всего накоплено в копилках', stats.totalSavings, `Цель: ${stats.totalTargetSavings}`],
        ['Общий остаток по кредитам и долгам', stats.totalDebtRemaining, `Начальная сумма: ${stats.totalDebtInitial}`],
      ];

      const txRows = [
        ['ID', 'Дата', 'Месяц', 'Тип', 'Категория', 'Название_Комментарий', 'Сумма_₽', 'Счет', 'Автор', 'Маршрут_Перевода', 'ID_Копилки', 'ID_Долга', 'ID_Регулярного'],
        ...[...transactions]
          .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
          .map(t => {
            const isOpening = Boolean(t.isOpeningBalance);
            const isTransfer = t.type === 'transfer';
            const fromW = isTransfer ? getWalletKeyFromTx(t) : null;
            const toW = isTransfer
              ? ((t.transferTo === 'shared' || t.transferTo === 'husband' || t.transferTo === 'wife')
                  ? t.transferTo
                  : (fromW === 'shared' ? 'husband' : 'shared'))
              : null;
            const routeLabel = isTransfer
              ? `${getWalletDisplayLabel(safeProfiles, fromW)} → ${getWalletDisplayLabel(safeProfiles, toW)}`
              : '';
            const typeLabel = isOpening
              ? 'Начальный остаток'
              : isTransfer
              ? 'Перевод'
              : (t.type === 'income' ? 'Доход' : 'Расход');
            const accountLabel = isTransfer
              ? 'Между счетами'
              : ((t.account || 'shared') === 'shared' ? 'Общий котел' : 'Личный');

            return [
              t.id || '',
              t.date || '',
              (t.date || '').slice(0, 7),
              typeLabel,
              t.category || '',
              t.title || '',
              isOpening && t.type === 'expense' ? -(Number(t.amount) || 0) : (Number(t.amount) || 0),
              accountLabel,
              t.author === 'wife' ? p2Name : p1Name,
              routeLabel,
              t.goalId || '',
              t.debtId || '',
              t.recurringId || '',
            ];
          }),
      ];

      const planRows = [
        ['Категория', 'Корзина_50_30_20', 'Прошлый_месяц_₽', 'Среднее_прошлых_мес_₽', 'Постоянные_счета_₽', 'Авто_прогноз_₽', 'План_на_месяц_₽', 'Факт_месяца_₽', 'Остаток_плана_₽', 'Использовано_%', 'Статус'],
        ...expenseForecastData.rows.map(r => [
          r.category,
          r.meta.bucket === 'base' ? 'База (50%)' : 'Хотелки (30%)',
          r.prevMonthSum,
          r.avgHistorical,
          r.recSum,
          r.autoSuggested,
          r.effectivePlan,
          r.currentActual,
          r.remainingPlan,
          r.pctUsed,
          r.isOverPlan ? 'Превышение плана' : 'В рамках плана',
        ]),
      ];

      const recRows = [
        ['ID', 'Название_платежа', 'Сумма_₽', 'День_оплаты', 'Категория', 'Счет', 'Автор', 'Обязательный', 'Статус_в_месяце', 'Оплаченные_месяцы'],
        ...recurringPayments.map(r => {
          const st = getRecurringReminderStatus(r, targetYm);
          return [
            r.id,
            r.title,
            Number(r.amount) || 0,
            Number(r.dueDate) || 1,
            r.category || '',
            (r.account || 'shared') === 'shared' ? 'Общий котел' : 'Личный',
            r.author === 'wife' ? p2Name : p1Name,
            r.isMandatory !== false ? 'Да' : 'Нет',
            st.label,
            (r.paidMonths || []).join(', '),
          ];
        }),
      ];

      const goalsDebtsRows = [
        ['Тип_Записи', 'ID', 'Название', 'Текущее_или_Остаток_₽', 'Цель_или_Начальный_долг_₽', 'Ежемесячный_платеж_₽', 'День_платежа', 'Прогресс_%', 'Оплаченные_месяцы'],
        ...goals.map(g => [
          'Копилка',
          g.id,
          g.title,
          Number(g.current) || 0,
          Number(g.target) || 0,
          0,
          '',
          g.target > 0 ? Math.round(((Number(g.current) || 0) / Number(g.target)) * 100) : 0,
          '',
        ]),
        ...debts.map(d => {
          const payoff = calculateDebtPayoff(d);
          return [
            'Кредит/Долг',
            d.id,
            d.title,
            payoff.remaining,
            payoff.total,
            payoff.monthly,
            d.isRegular === false ? '' : (Number(d.paymentDay) || 12),
            payoff.progressPct,
            (d.paidMonths || []).join(', '),
          ];
        }),
      ];

      return [
        { name: '1_Сводка', rows: summaryRows },
        { name: '2_Операции', rows: txRows },
        { name: '3_План_и_Прогноз', rows: planRows },
        { name: '4_Постоянные_счета', rows: recRows },
        { name: '5_Копилки_и_Долги', rows: goalsDebtsRows },
      ];
    };

    const buildBudgetXlsxBytes = (params) => {
      return buildXlsxBytes(buildBudgetXlsxSheets(params));
    };

    const buildStructuredCsvString = ({
      selectedMonth,
      activeWalletCard,
      stats,
      expenseForecastData,
      recurringPayments,
      debts,
      goals,
      customCategories,
      transactions,
    }) => {
      const header = [
        'Тип_Записи',
        'ID',
        'Дата_или_День',
        'Направление_или_Статус',
        'Категория',
        'Название_Комментарий',
        'Сумма_или_Текущее_₽',
        'Цель_или_Начальное_₽',
        'Платеж_или_План_₽',
        'Счет',
        'Автор',
        'Доп_Данные',
      ];
      const lines = [toCsvLine(header)];

      lines.push(toCsvLine(['SUMMARY', 'sum_shared', getLocalDateString(), 'balance', 'Общий котел', 'Переходящий остаток общего котла', stats.shared.balance, stats.shared.monthIncome, stats.shared.monthExpense, 'shared', 'both', `Безопасный лимит: ${stats.dailyAvailable} ₽/дн.`]));
      lines.push(toCsvLine(['SUMMARY', 'sum_husband', getLocalDateString(), 'balance', 'Личный счет партнера 1', 'Переходящий остаток партнера 1', stats.husbandPersonal.balance, stats.husbandPersonal.monthIncome, stats.husbandPersonal.monthExpense, 'personal', 'husband', '']));
      lines.push(toCsvLine(['SUMMARY', 'sum_wife', getLocalDateString(), 'balance', 'Личный счет партнера 2', 'Переходящий остаток партнера 2', stats.wifePersonal.balance, stats.wifePersonal.monthIncome, stats.wifePersonal.monthExpense, 'personal', 'wife', '']));

      expenseForecastData.rows.forEach(r => {
        lines.push(toCsvLine([
          'CATEGORY_PLAN',
          `plan_${r.category}`,
          selectedMonth,
          r.meta.bucket || 'base',
          r.category,
          `Прогноз из прошлых мес: ${r.autoSuggested} ₽ (ср. ${r.avgHistorical} ₽)`,
          r.currentActual,
          r.autoSuggested,
          r.effectivePlan,
          activeWalletCard,
          'both',
          r.userCustomLimit !== undefined ? `USER_LIMIT:${r.userCustomLimit}` : 'AUTO',
        ]));
      });

      recurringPayments.forEach(r => {
        lines.push(toCsvLine([
          'RECURRING',
          r.id,
          r.dueDate,
          r.isMandatory !== false ? 'mandatory' : 'optional',
          r.category || 'Дом и ЖКУ',
          r.title,
          r.amount,
          '',
          r.amount,
          r.account || 'shared',
          r.author || 'husband',
          (r.paidMonths || []).join('|'),
        ]));
      });

      debts.forEach(d => {
        lines.push(toCsvLine([
          'DEBT',
          d.id,
          d.paymentDay || 12,
          'active',
          'Долги и кредиты',
          d.title,
          d.remainingAmount,
          d.initialAmount,
          d.monthlyPayment,
          d.account || 'shared',
          d.author || 'husband',
          `${d.icon || '💳'};${d.color || 'from-rose-500 to-red-500'};${(d.paidMonths || []).join('|')};${d.isRegular === false ? 'flexible' : 'regular'}`,
        ]));
      });

      goals.forEach(g => {
        lines.push(toCsvLine([
          'GOAL',
          g.id,
          '',
          'active',
          'Накопления',
          g.title,
          g.current,
          g.target,
          '',
          'shared',
          'both',
          `${g.icon || '🎯'};${g.color || 'from-amber-500 to-orange-500'}`,
        ]));
      });

      customCategories.forEach(c => {
        lines.push(toCsvLine([
          'CUSTOM_CATEGORY',
          c.id,
          '',
          c.type || 'expense',
          c.name,
          c.name,
          0,
          0,
          0,
          'shared',
          'both',
          `${c.icon || '🏷️'};${c.color || 'bg-stone-100 text-stone-700'};${c.bucket || 'base'}`,
        ]));
      });

      [...transactions]
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
        .forEach(t => {
          const links = [
            t.goalId ? `goal:${t.goalId}` : '',
            t.debtId ? `debt:${t.debtId}` : '',
            t.recurringId ? `rec:${t.recurringId}` : '',
            t.transferTo ? `to:${t.transferTo}` : '',
            t.fromWallet ? `from:${t.fromWallet}` : '',
            t.isOpeningBalance ? 'opening:1' : '',
          ].filter(Boolean).join('|');

          lines.push(toCsvLine([
            'TRANSACTION',
            t.id,
            t.date,
            t.type,
            t.category,
            t.title,
            t.amount,
            '',
            '',
            t.account || 'shared',
            t.author || 'husband',
            links,
          ]));
        });

      return '\uFEFF' + lines.join('\r\n');
    };

    const buildJsonBackupPayload = ({
      transactions,
      goals,
      recurringPayments,
      debts,
      customCategories,
      plannedCategoryLimits,
      userProfiles,
      deviceOwner,
      safeLimitConfig,
    }) => ({
      version: APP_VERSION,
      exportedAt: new Date().toISOString(),
      transactions,
      goals,
      recurringPayments,
      debts,
      customCategories,
      plannedCategoryLimits,
      userProfiles,
      deviceOwner,
      safeLimitConfig,
    });

    const buildAiPromptReport = ({
      selectedMonth,
      stats,
      expenseForecastData,
      recurringPayments,
      debts,
      goals,
      periodTransactions,
      safeProfiles,
    }) => {
      const targetYm = selectedMonth === 'all' ? getCurrentMonthPrefix() : selectedMonth;
      const p1Name = getProfileDisplayName(safeProfiles, 'husband');
      const p2Name = getProfileDisplayName(safeProfiles, 'wife');

      const lines = [
        `Проведи финансовый аудит нашего семейного бюджета за период ${formatMonthTitle(selectedMonth)} (${targetYm}).`,
        `Укажи узкие места, оцени соблюдение правила 50/30/20, проверь нагрузку постоянных платежей и предложи конкретные шаги по оптимизации трат на следующий месяц.`,
        ``,
        `=== 1. БАЛАНСЫ И ПОТОКИ ===`,
        `- Общий котел (кумулятивный остаток): ${stats.shared.balance.toLocaleString('ru-RU')} ₽ (за месяц Доходы: +${stats.shared.monthIncome.toLocaleString('ru-RU')} ₽, Расходы: -${stats.shared.monthExpense.toLocaleString('ru-RU')} ₽, из них потребительские: ${stats.shared.consumerExpense.toLocaleString('ru-RU')} ₽, отложено/кредиты: ${stats.shared.savedAndDebtPaid.toLocaleString('ru-RU')} ₽)`,
        `- Личный счет (${p1Name}): ${stats.husbandPersonal.balance.toLocaleString('ru-RU')} ₽ (+${stats.husbandPersonal.monthIncome.toLocaleString('ru-RU')} / -${stats.husbandPersonal.monthExpense.toLocaleString('ru-RU')} ₽)`,
        `- Личный счет (${p2Name}): ${stats.wifePersonal.balance.toLocaleString('ru-RU')} ₽ (+${stats.wifePersonal.monthIncome.toLocaleString('ru-RU')} / -${stats.wifePersonal.monthExpense.toLocaleString('ru-RU')} ₽)`,
        `- Резерв на неоплаченные обязательные счета месяца: ${stats.unpaidMandatoryThisMonth.toLocaleString('ru-RU')} ₽`,
        `- Безопасный дневной лимит: ${stats.hasCashGap ? `Кассовый разрыв -${stats.cashGapAmount.toLocaleString('ru-RU')} ₽` : `${stats.dailyAvailable.toLocaleString('ru-RU')} ₽/день (осталось дней: ${stats.daysLeft})`}`,
        ``,
        `=== 2. ПЛАН / ПРОГНОЗ ПО КАТЕГОРИЯМ (ИЗ АНАЛИЗА ПРОШЛЫХ МЕСЯЦЕВ) ===`,
        ...expenseForecastData.rows.map(r =>
          `- ${r.category} [${r.meta.bucket === 'base' ? 'База' : 'Хотелки'}]: Факт = ${r.currentActual} ₽ | План/Прогноз = ${r.effectivePlan} ₽ (Среднее за прошлые мес: ${r.avgHistorical} ₽, Прошлый мес: ${r.prevMonthSum} ₽)`
        ),
        ``,
        `=== 3. ПОСТОЯННЫЕ ОБЯЗАТЕЛЬНЫЕ ПЛАТЕЖИ ===`,
        ...recurringPayments.map(r => {
          const st = getRecurringReminderStatus(r, targetYm);
          return `- ${r.title}: ${r.amount} ₽ (до ${r.dueDate}-го числа, ${r.category}) — ${st.label}`;
        }),
        ``,
        `=== 4. ДОЛГИ И КОПИЛКИ ===`,
        ...debts.map(d => `- Кредит «${d.title}»: остаток ${d.remainingAmount} ₽ из ${d.initialAmount} ₽ (платеж ${d.monthlyPayment} ₽ до ${d.paymentDay}-го)`),
        ...goals.map(g => `- Копилка «${g.title}»: накоплено ${g.current} ₽ из ${g.target} ₽`),
        ``,
        `=== 5. ОПЕРАЦИИ ВЫБРАННОГО ПЕРИОДА (${periodTransactions.length} шт.) ===`,
        `Дата;Тип;Категория;Название;Сумма_₽;Счет;Автор`,
        ...periodTransactions.map(t => {
          const accStr = t.type === 'transfer'
            ? `${t.fromWallet || getWalletKeyFromTx(t)}->${t.transferTo || 'shared'}`
            : (t.account || 'shared');
          const authStr = t.author === 'wife' ? p2Name : p1Name;
          const typeStr = t.isOpeningBalance ? `opening(${t.type})` : t.type;
          return `${t.date};${typeStr};${t.category};${t.title};${t.amount};${accStr};${authStr}`;
        }),
      ];
      return lines.join('\n');
    };

    const parseImportedBackupContent = ({
      content,
      fileName = '',
      isMerge = true,
      currentState = {},
    }) => {
      const existingTxs = Array.isArray(currentState.transactions) ? currentState.transactions : [];
      const existingGoals = Array.isArray(currentState.goals) ? currentState.goals : [];
      const existingRecs = Array.isArray(currentState.recurringPayments) ? currentState.recurringPayments : [];
      const existingDebts = Array.isArray(currentState.debts) ? currentState.debts : [];
      const existingCats = Array.isArray(currentState.customCategories) ? currentState.customCategories : [];
      const existingLimits = currentState.plannedCategoryLimits || {};
      const existingProfiles = currentState.userProfiles || {};

      const trimmed = String(content || '');
      if (fileName.toLowerCase().endsWith('.json') || trimmed.trim().startsWith('{')) {
        const parsed = JSON.parse(trimmed);
        const nextState = {};

        if (Array.isArray(parsed.transactions)) {
          const normTxs = parsed.transactions.map(t => ({ ...t, date: normalizeImportedDate(t.date) }));
          nextState.transactions = isMerge ? mergeTransactions(existingTxs, normTxs).merged : normTxs;
        }
        if (Array.isArray(parsed.goals)) {
          nextState.goals = isMerge ? mergeUniqueByIdOrKey(existingGoals, parsed.goals, g => g.title) : parsed.goals;
        }
        if (Array.isArray(parsed.recurringPayments)) {
          nextState.recurringPayments = isMerge ? mergeUniqueByIdOrKey(existingRecs, parsed.recurringPayments, r => r.title) : parsed.recurringPayments;
        }
        if (Array.isArray(parsed.debts)) {
          nextState.debts = isMerge ? mergeUniqueByIdOrKey(existingDebts, parsed.debts, d => d.title) : parsed.debts;
        }
        if (Array.isArray(parsed.customCategories)) {
          nextState.customCategories = isMerge ? mergeUniqueByIdOrKey(existingCats, parsed.customCategories, c => c.name) : parsed.customCategories;
        }
        if (parsed.plannedCategoryLimits && typeof parsed.plannedCategoryLimits === 'object') {
          nextState.plannedCategoryLimits = isMerge ? { ...existingLimits, ...parsed.plannedCategoryLimits } : parsed.plannedCategoryLimits;
        }
        if (parsed.userProfiles && typeof parsed.userProfiles === 'object') {
          nextState.userProfiles = isMerge ? { ...existingProfiles, ...parsed.userProfiles } : parsed.userProfiles;
        }
        if (parsed.deviceOwner && (parsed.deviceOwner === 'husband' || parsed.deviceOwner === 'wife')) {
          nextState.deviceOwner = parsed.deviceOwner;
        }
        if (parsed.safeLimitConfig && typeof parsed.safeLimitConfig === 'object') {
          nextState.safeLimitConfig = parsed.safeLimitConfig;
        }

        return {
          ok: true,
          nextState,
          message: isMerge
            ? `База дополнена из JSON (${(parsed.transactions || []).length} записей проверено)`
            : `Бэкап из JSON полностью восстановлен`,
        };
      }

      const rows = parseCsvText(trimmed);
      if (rows.length < 2) {
        return {
          ok: false,
          message: 'Файл пуст или не содержит строк данных',
        };
      }

      const header = rows[0].map(h => h.trim());
      const isStructuredBackup = header[0] === 'Тип_Записи';

      if (isStructuredBackup) {
        const nextTxs = [];
        const nextRecs = [];
        const nextDebts = [];
        const nextGoals = [];
        const nextCats = [];
        const nextLimits = {};

        rows.slice(1).forEach((r, idx) => {
          const [recType, id, dateOrDay, dirOrStatus, category, title, amountCur, targetInit, payPlan, account, author, extra] = r;
          if (recType === 'TRANSACTION') {
            const extraParts = (extra || '').split('|');
            const goalLink = extraParts.find(x => x.startsWith('goal:'))?.slice(5);
            const debtLink = extraParts.find(x => x.startsWith('debt:'))?.slice(5);
            const recLink = extraParts.find(x => x.startsWith('rec:'))?.slice(4);
            const toLink = extraParts.find(x => x.startsWith('to:'))?.slice(3);
            const fromLink = extraParts.find(x => x.startsWith('from:'))?.slice(5);
            const isOpening = extraParts.includes('opening:1');
            const parsedType = (dirOrStatus === 'transfer' || dirOrStatus === 'Перевод')
              ? 'transfer'
              : (dirOrStatus === 'income' || dirOrStatus === 'Доход' ? 'income' : 'expense');
            nextTxs.push({
              id: id || `imp_tx_${Date.now()}_${idx}`,
              date: normalizeImportedDate(dateOrDay),
              type: parsedType,
              category: category || 'Продукты',
              title: title || category || 'Операция',
              amount: parseImportedAmount(amountCur),
              account: account === 'personal' || account === 'Личный' ? 'personal' : 'shared',
              author: author === 'wife' || author === 'Жена' ? 'wife' : 'husband',
              ...(goalLink ? { goalId: goalLink } : {}),
              ...(debtLink ? { debtId: debtLink } : {}),
              ...(recLink ? { recurringId: recLink } : {}),
              ...(toLink ? { transferTo: toLink } : {}),
              ...(fromLink ? { fromWallet: fromLink } : {}),
              ...(isOpening ? { isOpeningBalance: true } : {}),
            });
          } else if (recType === 'RECURRING') {
            nextRecs.push({
              id: id || `imp_rec_${idx}`,
              title: title || category || 'Платеж',
              amount: parseImportedAmount(amountCur),
              dueDate: Number(dateOrDay) || 15,
              category: category || 'Дом и ЖКУ',
              account: account === 'personal' ? 'personal' : 'shared',
              author: author === 'wife' ? 'wife' : 'husband',
              isMandatory: dirOrStatus !== 'optional',
              paidMonths: (extra || '').split('|').filter(Boolean),
            });
          } else if (recType === 'DEBT') {
            const [icon, color, paidStr, regFlag] = (extra || '').split(';');
            const isReg = regFlag !== 'flexible';
            nextDebts.push({
              id: id || `imp_debt_${idx}`,
              title: title || 'Кредит',
              remainingAmount: parseImportedAmount(amountCur),
              initialAmount: parseImportedAmount(targetInit) || parseImportedAmount(amountCur) || 100000,
              monthlyPayment: isReg ? (parseImportedAmount(payPlan) || 10000) : 0,
              paymentDay: Number(dateOrDay) || 12,
              account: account === 'personal' ? 'personal' : 'shared',
              author: author === 'wife' ? 'wife' : 'husband',
              isRegular: isReg,
              icon: icon || '💳',
              color: color || 'from-rose-500 to-red-500',
              paidMonths: (paidStr || '').split('|').filter(Boolean),
            });
          } else if (recType === 'GOAL') {
            const [icon, color] = (extra || '').split(';');
            nextGoals.push({
              id: id || `imp_goal_${idx}`,
              title: title || 'Цель',
              current: parseImportedAmount(amountCur),
              target: parseImportedAmount(targetInit) || 100000,
              icon: icon || '🎯',
              color: color || 'from-amber-500 to-orange-500',
            });
          } else if (recType === 'CUSTOM_CATEGORY') {
            const [icon, color, bucket] = (extra || '').split(';');
            nextCats.push({
              id: id || `imp_cat_${idx}`,
              name: category || title,
              type: dirOrStatus === 'income' ? 'income' : 'expense',
              icon: icon || '🏷️',
              color: color || 'bg-stone-100 text-stone-700',
              bucket: bucket || 'base',
            });
          } else if (recType === 'CATEGORY_PLAN') {
            if ((extra || '').startsWith('USER_LIMIT:')) {
              const lim = Number(extra.split(':')[1]);
              if (lim > 0 && category) nextLimits[category] = lim;
            }
          }
        });

        const nextState = {};
        if (nextTxs.length > 0) {
          nextState.transactions = isMerge ? mergeTransactions(existingTxs, nextTxs).merged : nextTxs;
        }
        if (nextRecs.length > 0) {
          nextState.recurringPayments = isMerge ? mergeUniqueByIdOrKey(existingRecs, nextRecs, r => r.title) : nextRecs;
        }
        if (nextDebts.length > 0) {
          nextState.debts = isMerge ? mergeUniqueByIdOrKey(existingDebts, nextDebts, d => d.title) : nextDebts;
        }
        if (nextGoals.length > 0) {
          nextState.goals = isMerge ? mergeUniqueByIdOrKey(existingGoals, nextGoals, g => g.title) : nextGoals;
        }
        if (nextCats.length > 0) {
          nextState.customCategories = isMerge ? mergeUniqueByIdOrKey(existingCats, nextCats, c => c.name) : nextCats;
        }
        if (Object.keys(nextLimits).length > 0) {
          nextState.plannedCategoryLimits = isMerge ? { ...existingLimits, ...nextLimits } : nextLimits;
        }

        return {
          ok: true,
          nextState,
          message: isMerge
            ? `Данные из CSV объединены с базой (+${nextTxs.length} операций)`
            : `Полный бэкап из CSV восстановлен (${nextTxs.length} операций)`,
        };
      }

      // Импорт банковской выписки или произвольного CSV с автонормализацией дат DD.MM.YYYY
      const importedTxs = rows.slice(1).map((r, idx) => {
        const hasIdCol = r.length >= 7;
        const rawDate = hasIdCol ? r[1] : r[0];
        const rawType = hasIdCol ? r[3] : r[1];
        const rawCat = hasIdCol ? r[4] : r[2];
        const rawTitle = hasIdCol ? r[5] : r[3];
        const rawAmount = hasIdCol ? (r[6] || r[2]) : (r[4] || r[2]);
        const rawAcc = hasIdCol ? r[7] : r[5];
        const rawAuth = hasIdCol ? r[8] : r[6];

        const isInc = String(rawType || '').toLowerCase().includes('доход') ||
                      String(rawType || '').toLowerCase() === 'income' ||
                      String(rawAmount || '').trim().startsWith('+');

        return {
          id: (hasIdCol && r[0]) ? r[0] : `csv_tx_${Date.now()}_${idx}`,
          date: normalizeImportedDate(rawDate),
          type: isInc ? 'income' : 'expense',
          category: rawCat || 'Продукты',
          title: rawTitle || rawCat || 'Операция из CSV',
          amount: parseImportedAmount(rawAmount),
          account: String(rawAcc || '').toLowerCase().includes('личн') || rawAcc === 'personal' ? 'personal' : 'shared',
          author: String(rawAuth || '').toLowerCase().includes('жен') || rawAuth === 'wife' ? 'wife' : 'husband',
        };
      }).filter(t => t.amount > 0);

      if (importedTxs.length > 0) {
        const mergeRes = isMerge ? mergeTransactions(existingTxs, importedTxs) : null;
        return {
          ok: true,
          nextState: {
            transactions: isMerge ? mergeRes.merged : importedTxs,
          },
          message: isMerge
            ? `Добавлено ${mergeRes.addedCount} операций из CSV (дублей пропущено: ${mergeRes.skippedCount})`
            : `База заменена: загружено ${importedTxs.length} операций из CSV`,
        };
      }

      return {
        ok: false,
        message: 'Не найдено корректных строк с суммами для импорта',
      };
    };

    // ============================================================================
    // MODULE: src/utils/deltaSync.js
    // ============================================================================
    // Движок дельта-синхронизации LWW (Last-Write-Wins) с поддержкой soft-delete tombstones (FB-10)
    const SYNC_ENTITY_KEYS = [
      'transactions',
      'goals',
      'recurringPayments',
      'debts',
      'customCategories',
    ];

    const DEFAULT_FALLBACK_UPDATED_AT = '2026-01-01T00:00:00.000Z';
    const TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000;

    const toValidIso = (raw) => {
      if (!raw || typeof raw !== 'string') return null;
      const ms = Date.parse(raw);
      return Number.isFinite(ms) ? new Date(ms).toISOString() : null;
    };

    const getDeterministicFallbackTimestamp = (item) => {
      const existing = toValidIso(item?.updatedAt);
      if (existing) return existing;
      if (item?.date && /^\d{4}-\d{2}-\d{2}$/.test(item.date)) {
        return `${item.date}T00:00:00.000Z`;
      }
      return DEFAULT_FALLBACK_UPDATED_AT;
    };

    const ensureItemTimestamp = (item, fallbackIso = null) => {
      if (!item || typeof item !== 'object') return item;
      const ts = toValidIso(item.updatedAt) || getDeterministicFallbackTimestamp(item) || fallbackIso || DEFAULT_FALLBACK_UPDATED_AT;
      if (item.updatedAt === ts) return item;
      return { ...item, updatedAt: ts };
    };

    const ensureCollectionTimestamps = (list = []) => {
      if (!Array.isArray(list)) return [];
      return list.map(item => ensureItemTimestamp(item));
    };

    const touchItemTimestamp = (item, nowIso = new Date().toISOString()) => {
      if (!item || typeof item !== 'object') return item;
      return { ...item, updatedAt: nowIso };
    };

    const pruneOldTombstones = (tombstones = [], nowMs = Date.now()) => {
      if (!Array.isArray(tombstones)) return [];
      const cutoff = nowMs - TOMBSTONE_TTL_MS;
      const dedup = new Map();

      for (const t of tombstones) {
        if (!t || !t.entityType || t.id === undefined || t.id === null) continue;
        const iso = toValidIso(t.deletedAt);
        if (!iso) continue;
        const ms = Date.parse(iso);
        if (ms < cutoff) continue;
        const key = `${t.entityType}:${String(t.id)}`;
        const prev = dedup.get(key);
        if (!prev || Date.parse(prev.deletedAt) < ms) {
          dedup.set(key, { entityType: t.entityType, id: String(t.id), deletedAt: iso });
        }
      }
      return Array.from(dedup.values());
    };

    const recordDeletionTombstone = (
      tombstones = [],
      entityType,
      id,
      deletedAt = new Date().toISOString()
    ) => {
      if (!entityType || id === undefined || id === null) return pruneOldTombstones(tombstones);
      const strId = String(id);
      const filtered = (Array.isArray(tombstones) ? tombstones : []).filter(
        t => !(t && t.entityType === entityType && String(t.id) === strId)
      );
      filtered.push({ entityType, id: strId, deletedAt });
      return pruneOldTombstones(filtered);
    };

    const removeDeletionTombstone = (tombstones = [], entityType, id) => {
      if (!entityType || id === undefined || id === null) return Array.isArray(tombstones) ? tombstones : [];
      const strId = String(id);
      return (Array.isArray(tombstones) ? tombstones : []).filter(
        t => !(t && t.entityType === entityType && String(t.id) === strId)
      );
    };

    const parseTsMs = (iso) => {
      if (!iso) return 0;
      const ms = Date.parse(iso);
      return Number.isFinite(ms) ? ms : 0;
    };

    // LWW-слияние одной коллекции с учетом tombstones
    const mergeEntityCollection = (
      localActive = [],
      localTombstones = [],
      remoteActive = [],
      remoteTombstones = [],
      entityType = 'transactions'
    ) => {
      const localMap = new Map();
      const remoteMap = new Map();
      const localTombMap = new Map();
      const remoteTombMap = new Map();
      const allIds = new Set();

      for (const item of Array.isArray(localActive) ? localActive : []) {
        if (!item || item.id === undefined || item.id === null) continue;
        const sid = String(item.id);
        const norm = ensureItemTimestamp(item);
        localMap.set(sid, norm);
        allIds.add(sid);
      }

      for (const item of Array.isArray(remoteActive) ? remoteActive : []) {
        if (!item || item.id === undefined || item.id === null) continue;
        const sid = String(item.id);
        const norm = ensureItemTimestamp(item);
        remoteMap.set(sid, norm);
        allIds.add(sid);
      }

      for (const t of Array.isArray(localTombstones) ? localTombstones : []) {
        if (!t || t.entityType !== entityType || t.id === undefined || t.id === null) continue;
        const sid = String(t.id);
        localTombMap.set(sid, t);
        allIds.add(sid);
      }

      for (const t of Array.isArray(remoteTombstones) ? remoteTombstones : []) {
        if (!t || t.entityType !== entityType || t.id === undefined || t.id === null) continue;
        const sid = String(t.id);
        remoteTombMap.set(sid, t);
        allIds.add(sid);
      }

      const mergedActive = [];
      const mergedTombstones = [];
      let added = 0;
      let updated = 0;
      let deleted = 0;

      for (const sid of allIds) {
        const la = localMap.get(sid);
        const ra = remoteMap.get(sid);
        const lt = localTombMap.get(sid);
        const rt = remoteTombMap.get(sid);

        const laTs = la ? parseTsMs(la.updatedAt) : -1;
        const raTs = ra ? parseTsMs(ra.updatedAt) : -1;
        const ltTs = lt ? parseTsMs(lt.deletedAt) : -1;
        const rtTs = rt ? parseTsMs(rt.deletedAt) : -1;

        let bestActive = null;
        let bestActiveTs = -1;
        if (la && ra) {
          if (raTs > laTs) {
            bestActive = ra;
            bestActiveTs = raTs;
          } else {
            bestActive = la;
            bestActiveTs = laTs;
          }
        } else if (la) {
          bestActive = la;
          bestActiveTs = laTs;
        } else if (ra) {
          bestActive = ra;
          bestActiveTs = raTs;
        }

        let bestTomb = null;
        let bestTombTs = -1;
        if (lt && rt) {
          if (rtTs >= ltTs) {
            bestTomb = rt;
            bestTombTs = rtTs;
          } else {
            bestTomb = lt;
            bestTombTs = ltTs;
          }
        } else if (lt) {
          bestTomb = lt;
          bestTombTs = ltTs;
        } else if (rt) {
          bestTomb = rt;
          bestTombTs = rtTs;
        }

        // При равенстве таймстампов удаление побеждает правку для защиты от «зомби»
        if (bestTomb && bestTombTs >= bestActiveTs) {
          mergedTombstones.push(bestTomb);
          if (la) deleted++;
        } else if (bestActive) {
          mergedActive.push(bestActive);
          if (!la && ra) {
            added++;
          } else if (la && bestActive === ra && JSON.stringify(la) !== JSON.stringify(ra)) {
            updated++;
          }
        }
      }

      if (entityType === 'transactions') {
        mergedActive.sort((a, b) => {
          const cmp = (b.date || '').localeCompare(a.date || '');
          if (cmp !== 0) return cmp;
          return String(b.id || '').localeCompare(String(a.id || ''));
        });
      }

      return {
        active: mergedActive,
        tombstones: mergedTombstones,
        stats: { added, updated, deleted },
      };
    };

    // Сборка инкрементальной дельты (или полного снимка при sinceIso === null)
    const buildSyncDelta = (state = {}, sinceIso = null, nowIso = new Date().toISOString()) => {
      const sinceMs = sinceIso ? parseTsMs(sinceIso) : -1;
      const entities = {};

      for (const key of SYNC_ENTITY_KEYS) {
        const list = ensureCollectionTimestamps(state[key] || []);
        entities[key] = sinceMs >= 0
          ? list.filter(item => parseTsMs(item.updatedAt) > sinceMs)
          : list;
      }

      const allTombstones = pruneOldTombstones(state.syncTombstones || []);
      const tombstones = sinceMs >= 0
        ? allTombstones.filter(t => parseTsMs(t.deletedAt) > sinceMs)
        : allTombstones;

      const meta = state.settingsSyncMeta || {};
      const settings = {};
      const settingsMeta = {};

      const profTs = meta.userProfiles || DEFAULT_FALLBACK_UPDATED_AT;
      if (state.userProfiles && (sinceMs < 0 || parseTsMs(profTs) > sinceMs)) {
        settings.userProfiles = state.userProfiles;
        settingsMeta.userProfiles = profTs;
      }

      const limitCfgTs = meta.safeLimitConfig || DEFAULT_FALLBACK_UPDATED_AT;
      if (state.safeLimitConfig && (sinceMs < 0 || parseTsMs(limitCfgTs) > sinceMs)) {
        settings.safeLimitConfig = state.safeLimitConfig;
        settingsMeta.safeLimitConfig = limitCfgTs;
      }

      const localLimits = state.plannedCategoryLimits || {};
      const localLimitsMeta = meta.plannedCategoryLimits || {};
      const allLimitCats = new Set([...Object.keys(localLimits), ...Object.keys(localLimitsMeta)]);
      const deltaLimits = {};
      const deltaLimitsMeta = {};
      let hasLimitsDelta = false;

      for (const cat of allLimitCats) {
        const entryMeta = localLimitsMeta[cat] || { updatedAt: DEFAULT_FALLBACK_UPDATED_AT, deleted: false };
        const ts = entryMeta.updatedAt || DEFAULT_FALLBACK_UPDATED_AT;
        if (sinceMs < 0 || parseTsMs(ts) > sinceMs) {
          hasLimitsDelta = true;
          deltaLimitsMeta[cat] = entryMeta;
          if (!entryMeta.deleted && localLimits[cat] !== undefined) {
            deltaLimits[cat] = localLimits[cat];
          }
        }
      }

      if (hasLimitsDelta) {
        settings.plannedCategoryLimits = deltaLimits;
        settingsMeta.plannedCategoryLimits = deltaLimitsMeta;
      }

      return {
        v: 1,
        kind: 'fb_sync_delta',
        generatedAt: nowIso,
        since: sinceIso || null,
        entities,
        tombstones,
        settings,
        settingsMeta,
      };
    };

    // Применение входящей дельты/снимка к локальному состоянию
    const mergeSyncPayload = (localState = {}, remoteDelta = {}) => {
      const localTombstones = pruneOldTombstones(localState.syncTombstones || []);
      const remoteTombstones = pruneOldTombstones(remoteDelta.tombstones || []);

      const nextEntities = {};
      let nextTombstones = [];
      const totalStats = { added: 0, updated: 0, deleted: 0, settingsUpdated: 0 };

      for (const key of SYNC_ENTITY_KEYS) {
        const res = mergeEntityCollection(
          localState[key] || [],
          localTombstones,
          remoteDelta.entities?.[key] || [],
          remoteTombstones,
          key
        );
        nextEntities[key] = res.active;
        nextTombstones = nextTombstones.concat(res.tombstones);
        totalStats.added += res.stats.added;
        totalStats.updated += res.stats.updated;
        totalStats.deleted += res.stats.deleted;
      }

      // Сохранение любых tombstones с неизвестными/будущими entityType
      for (const t of [...localTombstones, ...remoteTombstones]) {
        if (!SYNC_ENTITY_KEYS.includes(t.entityType)) {
          nextTombstones.push(t);
        }
      }
      nextTombstones = pruneOldTombstones(nextTombstones);

      const localMeta = localState.settingsSyncMeta || {};
      const remoteMeta = remoteDelta.settingsMeta || {};
      const remoteSettings = remoteDelta.settings || {};
      const nextMeta = {
        userProfiles: localMeta.userProfiles || DEFAULT_FALLBACK_UPDATED_AT,
        safeLimitConfig: localMeta.safeLimitConfig || DEFAULT_FALLBACK_UPDATED_AT,
        plannedCategoryLimits: { ...(localMeta.plannedCategoryLimits || {}) },
      };

      let nextUserProfiles = localState.userProfiles;
      if (remoteSettings.userProfiles && remoteMeta.userProfiles) {
        if (parseTsMs(remoteMeta.userProfiles) > parseTsMs(nextMeta.userProfiles)) {
          nextUserProfiles = remoteSettings.userProfiles;
          nextMeta.userProfiles = remoteMeta.userProfiles;
          totalStats.settingsUpdated++;
        }
      }

      let nextSafeLimitConfig = localState.safeLimitConfig;
      if (remoteSettings.safeLimitConfig && remoteMeta.safeLimitConfig) {
        if (parseTsMs(remoteMeta.safeLimitConfig) > parseTsMs(nextMeta.safeLimitConfig)) {
          nextSafeLimitConfig = remoteSettings.safeLimitConfig;
          nextMeta.safeLimitConfig = remoteMeta.safeLimitConfig;
          totalStats.settingsUpdated++;
        }
      }

      const nextLimits = { ...(localState.plannedCategoryLimits || {}) };
      const remoteLimits = remoteSettings.plannedCategoryLimits || {};
      const remoteLimitsMeta = remoteMeta.plannedCategoryLimits || {};
      const allCats = new Set([...Object.keys(nextLimits), ...Object.keys(remoteLimits), ...Object.keys(remoteLimitsMeta)]);

      for (const cat of allCats) {
        const lMeta = nextMeta.plannedCategoryLimits[cat] || {
          updatedAt: DEFAULT_FALLBACK_UPDATED_AT,
          deleted: nextLimits[cat] === undefined,
        };
        const rMeta = remoteLimitsMeta[cat];
        if (!rMeta) continue;

        if (parseTsMs(rMeta.updatedAt) > parseTsMs(lMeta.updatedAt)) {
          nextMeta.plannedCategoryLimits[cat] = rMeta;
          if (rMeta.deleted || remoteLimits[cat] === undefined) {
            delete nextLimits[cat];
          } else {
            nextLimits[cat] = remoteLimits[cat];
          }
          totalStats.settingsUpdated++;
        }
      }

      totalStats.totalChanged = totalStats.added + totalStats.updated + totalStats.deleted + totalStats.settingsUpdated;

      return {
        nextState: {
          ...nextEntities,
          syncTombstones: nextTombstones,
          userProfiles: nextUserProfiles,
          safeLimitConfig: nextSafeLimitConfig,
          plannedCategoryLimits: nextLimits,
          settingsSyncMeta: nextMeta,
        },
        stats: totalStats,
      };
    };

    // Компактное Base64URL кодирование / декодирование для ссылок и буфера обмена
    const bytesToBase64Url = (bytes) => {
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      const b64 = typeof btoa === 'function'
        ? btoa(binary)
        : Buffer.from(bytes).toString('base64');
      return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
