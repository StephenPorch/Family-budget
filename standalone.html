    const base64UrlToBytes = (str) => {
      const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
      const full = b64 + pad;
      if (typeof atob === 'function') {
        const bin = atob(full);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      return new Uint8Array(Buffer.from(full, 'base64'));
    };

    const compressUtf8Bytes = async (utf8Bytes) => {
      if (typeof CompressionStream === 'undefined') return null;
      const cs = new CompressionStream('deflate-raw');
      const writer = cs.writable.getWriter();
      writer.write(utf8Bytes);
      writer.close();
      const ab = await new Response(cs.readable).arrayBuffer();
      return new Uint8Array(ab);
    };

    const decompressUtf8Bytes = async (compressedBytes) => {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('Браузер не поддерживает DecompressionStream');
      }
      const ds = new DecompressionStream('deflate-raw');
      const writer = ds.writable.getWriter();
      writer.write(compressedBytes);
      writer.close();
      const ab = await new Response(ds.readable).arrayBuffer();
      return new Uint8Array(ab);
    };

    const encodeDeltaPacket = async (deltaObj) => {
      const jsonStr = JSON.stringify(deltaObj);
      const utf8Bytes = new TextEncoder().encode(jsonStr);
      try {
        const compressed = await compressUtf8Bytes(utf8Bytes);
        if (compressed && compressed.length < utf8Bytes.length) {
          return `fbz1:${bytesToBase64Url(compressed)}`;
        }
      } catch {
        // Fallback на несжатый формат
      }
      return `fb1:${bytesToBase64Url(utf8Bytes)}`;
    };

    const decodeDeltaPacket = async (rawInput) => {
      let token = String(rawInput || '').trim();
      if (!token) throw new Error('Пустой код синхронизации');

      // Извлекаем параметр ?sync=... или #sync=... если передан полный URL
      if (/^https?:\/\//i.test(token) || token.includes('?sync=') || token.includes('&sync=')) {
        try {
          const urlObj = new URL(token.startsWith('http') ? token : `https://local.invalid/${token}`);
          const syncParam = urlObj.searchParams.get('sync');
          if (syncParam) token = syncParam.trim();
        } catch {
          const m = token.match(/[?&#]sync=([^&#]+)/);
          if (m) token = decodeURIComponent(m[1]).trim();
        }
      }

      if (token.startsWith('{')) {
        const parsed = JSON.parse(token);
        if (!parsed || parsed.kind !== 'fb_sync_delta') {
          throw new Error('Неверный формат JSON-дельты');
        }
        return parsed;
      }

      if (token.startsWith('fbz1:')) {
        const compressed = base64UrlToBytes(token.slice(5));
        const utf8 = await decompressUtf8Bytes(compressed);
        const parsed = JSON.parse(new TextDecoder().decode(utf8));
        if (!parsed || parsed.kind !== 'fb_sync_delta') {
          throw new Error('Поврежденная дельта синхронизации');
        }
        return parsed;
      }

      if (token.startsWith('fb1:')) {
        const utf8 = base64UrlToBytes(token.slice(4));
        const parsed = JSON.parse(new TextDecoder().decode(utf8));
        if (!parsed || parsed.kind !== 'fb_sync_delta') {
          throw new Error('Поврежденная дельта синхронизации');
        }
        return parsed;
      }

      throw new Error('Неподдерживаемый формат кода синхронизации');
    };

    const encodePairingPayload = ({ webhookUrl, syncSecret }) => {
      const payload = {
        v: 1,
        kind: 'fb_pair',
        u: String(webhookUrl || '').trim(),
        s: String(syncSecret || '').trim(),
      };
      const bytes = new TextEncoder().encode(JSON.stringify(payload));
      return `fbp1:${bytesToBase64Url(bytes)}`;
    };

    const decodePairingPayload = (rawInput) => {
      let token = String(rawInput || '').trim();
      if (!token) throw new Error('Пустая ссылка подключения');

      if (/^https?:\/\//i.test(token) || token.includes('?pair=') || token.includes('&pair=')) {
        try {
          const urlObj = new URL(token.startsWith('http') ? token : `https://local.invalid/${token}`);
          const pairParam = urlObj.searchParams.get('pair');
          if (pairParam) token = pairParam.trim();
        } catch {
          const m = token.match(/[?&#]pair=([^&#]+)/);
          if (m) token = decodeURIComponent(m[1]).trim();
        }
      }

      if (!token.startsWith('fbp1:')) {
        throw new Error('Неверный формат ссылки подключения');
      }
      const bytes = base64UrlToBytes(token.slice(5));
      const parsed = JSON.parse(new TextDecoder().decode(bytes));
      if (!parsed || parsed.kind !== 'fb_pair' || !parsed.u) {
        throw new Error('Некорректные данные подключения');
      }
      return {
        webhookUrl: String(parsed.u).trim(),
        syncSecret: String(parsed.s || '').trim(),
      };
    };

    const GF_EXP = new Uint8Array(512);
    const GF_LOG = new Uint8Array(256);
    (() => {

      for (let i = 0; i < 255; i++) {
        GF_EXP[i] = x;
        GF_LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;

        GF_EXP[i] = GF_EXP[i - 255];

    const buildRsGeneratorPoly = (degree) => {
      let poly = [1];
      for (let i = 0; i < degree; i++) {
        const next = new Array(poly.length + 1).fill(0);
        const root = GF_EXP[i];
        for (let j = 0; j < poly.length; j++) {
          next[j] ^= poly[j];
          next[j + 1] ^= gfMul(poly[j], root);

        poly = next;

      const gen = buildRsGeneratorPoly(ecCount);
      const res = new Uint8Array(ecCount);
      for (let i = 0; i < dataBytes.length; i++) {
        const factor = dataBytes[i] ^ res[0];
        for (let j = 0; j < ecCount - 1; j++) {
          res[j] = res[j + 1];
        }
        res[ecCount - 1] = 0;
        if (factor !== 0) {

    const computeFormatBitsL = (maskId) => {

      let d = data << 10;
      for (let i = 4; i >= 0; i--) {
        if (d & (1 << (i + 10))) {

      return ((data << 10) | d) ^ 0x5412;

    const computeVersionBits = (version) => {

    const MASK_FNS = [

      (r, c) => (r + c) % 3 === 0,

        arr[i + 5] === 0 && arr[i + 6] === 1 && arr[i + 7] === 1 && arr[i + 8] === 1 && arr[i + 9] === 0 && arr[i + 10] === 1;

      for (let col = 0; col < spec.ecPerBlock; col++) {

      let bitInByte = 7;

    // 1. Вставьте этот код в Расширения -> Apps Script вашей Google Таблицы
    // 2. Нажмите «Начать развертывание» -> «Новое развертывание» -> «Веб-приложение»

    const STORE_SHEET = 'Sync_Store';
    const VIEW_SHEET = 'Операции';
    const ENTITY_KEYS = ['transactions', 'goals', 'recurringPayments', 'debts', 'customCategories'];

    function jsonResponse(obj) {
      return ContentService

    function parseMs(iso) {

    function ensureSheets(ss) {
      let view = ss.getSheetByName(VIEW_SHEET);
      if (!view) {
        view = ss.getSheets()[0] || ss.insertSheet(VIEW_SHEET);
        view.setName(VIEW_SHEET);
      }
      let store = ss.getSheetByName(STORE_SHEET);
      if (!store) {

      }

    }

    function readStoreMap(store) {
      const lastRow = store.getLastRow();
      const map = {};
      if (lastRow < 2) return map;
      const rows = store.getRange(2, 1, lastRow - 1, 5).getValues();
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const entityType = String(r[0] || '');
        const id = String(r[1] || '');
        if (!entityType || !id) continue;
        map[entityType + ':' + id] = {
          entityType: entityType,
          id: id,
          updatedAt: String(r[2] || ''),
          deletedAt: String(r[3] || ''),
          jsonPayload: String(r[4] || ''),
        };
      }
      return map;

      const rows = [['EntityType', 'Id', 'UpdatedAt', 'DeletedAt', 'JsonPayload']];
      const keys = Object.keys(map);
      for (let i = 0; i < keys.length; i++) {
        const item = map[keys[i]];
        rows.push([item.entityType, item.id, item.updatedAt, item.deletedAt, item.jsonPayload]);
      }
      store.clearContents();
      store.getRange(1, 1, rows.length, 5).setValues(rows);

      const txRows = [];
      const keys = Object.keys(map);
      for (let i = 0; i < keys.length; i++) {
        const rec = map[keys[i]];
        if (rec.entityType !== 'transactions' || rec.deletedAt) continue;

    function doPost(e) {

                id: String(item.id),

                deletedAt: '',

          const mapKey = t.entityType + ':' + String(t.id);
          const cur = map[mapKey];
          const delTs = parseMs(t.deletedAt);
          const curActiveTs = cur ? parseMs(cur.updatedAt) : -1;
          const curDelTs = cur ? parseMs(cur.deletedAt) : -1;
          if (!cur || delTs >= Math.max(curActiveTs, curDelTs)) {
            map[mapKey] = {
              entityType: t.entityType,
              id: String(t.id),
              updatedAt: '',
              deletedAt: t.deletedAt || serverTime,
              jsonPayload: '',
            };
            changed = true;
          }
        }

        const sMeta = delta.settingsMeta || {};

          if (settings[sKey] && sMeta[sKey]) {
            const mapKey = 'settings:' + sKey;
            const cur = map[mapKey];
            if (!cur || parseMs(sMeta[sKey]) > parseMs(cur.updatedAt)) {
              map[mapKey] = {
                entityType: 'settings',
                id: sKey,
                updatedAt: sMeta[sKey],
                deletedAt: '',
                jsonPayload: JSON.stringify(settings[sKey]),
              };
              changed = true;
            }

          const rec = map[allKeys[i]];

      } finally {

      }
    }

          method: 'POST',
          headers: {
            // Используем text/plain, чтобы избежать CORS preflight OPTIONS в Google Apps Script
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify(bodyObj),
          ...(controller ? { signal: controller.signal } : {}),
        });

        const text = await response.text();
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch {
          throw new Error('Google Apps Script вернул HTML вместо JSON. Проверьте доступ: «Все (Anyone)» при развертывании.');
        }
        if (!parsed.ok) {
          throw new Error(parsed.error || 'Ошибка синхронизации на стороне Google Таблицы');
        }
        return parsed;
      } catch (err) {
        if (err && err.name === 'AbortError') {
          throw new Error('Превышено время ожидания ответа от Google Таблицы');
        }
        throw err;
      } finally {
        if (timer) clearTimeout(timer);
      }
    };

    // ============================================================================
    // Хук ловушки фокуса (Focus Trap) для соблюдения стандарта доступности WCAG 2.1.2 в модальных окнах
    const useFocusTrap = (isOpen, containerRef) => {
      useEffect(() => {
        if (!isOpen || !containerRef?.current) return;

        const container = containerRef.current;
        const previouslyFocused = document.activeElement;

        const getFocusableElements = () => {
          return Array.from(
            container.querySelectorAll(
              'button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            )
          );
        };

        const handleTabKey = (e) => {
          if (e.key !== 'Tab') return;
          const focusables = getFocusableElements();
          if (focusables.length === 0) return;

          const first = focusables[0];
          const last = focusables[focusables.length - 1];

          if (e.shiftKey) {
            if (document.activeElement === first || !container.contains(document.activeElement)) {
              e.preventDefault();
              last.focus();
            }
          } else {
            if (document.activeElement === last || !container.contains(document.activeElement)) {
              e.preventDefault();
              first.focus();
            }
          }
        };

        container.addEventListener('keydown', handleTabKey);
        return () => {
          container.removeEventListener('keydown', handleTabKey);
          if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
            previouslyFocused.focus();
          }
        };
      }, [isOpen, containerRef]);
    };

    // ============================================================================
    /**
     * Хук для безопасного закрытия модального окна по клику на подложку (backdrop).
     * Предотвращает ложное срабатывание, когда пользователь начинает выделять текст мышью внутри инпута (mousedown),
     * протягивает курсор за границу окна/инпута и отпускает клавишу мыши над подложкой (mouseup).
     * Закрытие срабатывает ТОЛЬКО если и нажатие (mousedown/touchstart), и клик произошли непосредственно на оверлее.
     */
    const useBackdropDismiss = (onClose) => {
      const isPointerDownOnBackdrop = useRef(false);

      const handlePointerDown = (e) => {
        isPointerDownOnBackdrop.current = e.target === e.currentTarget;
      };

      const handleClick = (e) => {
        if (isPointerDownOnBackdrop.current && e.target === e.currentTarget) {
          if (typeof onClose === 'function') {
            onClose();
          }
        }
        isPointerDownOnBackdrop.current = false;
      };

      return {
        onMouseDown: handlePointerDown,
        onTouchStart: handlePointerDown,
        onClick: handleClick,
      };
    };

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught an error:', error, errorInfo);
      }

      handleReset = async () => {
        try {
          localStorage.clear();
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) {
              await reg.unregister();
            }
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            for (const k of keys) {
              await caches.delete(k);
            }
          }
        } catch (e) {
          console.error('Reset error:', e);
        }
        window.location.reload();
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-stone-50 flex items-center justify-center p-4 text-stone-900 font-sans">
              <div className="max-w-md w-full bg-white p-6 rounded-2xl border border-stone-200/80 shadow-lg text-center space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-2xl">
                  ⚠️
                </div>
                <div>
                  <h1 className="text-base font-bold text-stone-900">Ошибка загрузки приложения</h1>
                  <p className="text-xs text-stone-500 mt-1">
                    Данные из старого кэша или памяти устройства вызвали сбой при отображении.
                  </p>
                </div>
                {this.state.error && (
                  <div className="p-3 bg-stone-100 rounded-xl text-left font-mono text-[11px] text-rose-700 overflow-x-auto max-h-32">
                    {String(this.state.error?.message || this.state.error)}
                  </div>
                )}
                <div className="pt-2 flex flex-col gap-2">
                  <button
                    type="button"
                    onClick={this.handleReset}
                    className="w-full h-10 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold transition shadow-sm flex items-center justify-center gap-1.5"
                  >
                    🔄 Очистить кэш и восстановить приложение
                  </button>
                  <button
                    type="button"
                    onClick={() => window.location.reload()}
                    className="w-full h-10 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-semibold transition"
                  >
                    Попробовать снова
                  </button>
                </div>
              </div>
            </div>
          );
        }

        return this.props.children;
      }
    }

    const getShareBaseUrl = () => {
      if (typeof window === 'undefined') return '';
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        return `${window.location.origin}${window.location.pathname}`;
      }
      return '';
    };

    const copyTextToClipboard = async (text) => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    };

    const FamilySyncModal = React.memo(function FamilySyncModal({
      isOpen,
      onClose,
      syncConfig,
      onSaveSyncConfig,
      lastSyncAt,
      hasUnsyncedChanges,
      isSyncing,
      syncError,
      onSyncNow,
      onTestConnection,
      localState,
      pendingIncomingPair,
      onClearPendingPair,
      pendingIncomingDeltaToken,
      onClearPendingDeltaToken,
      onApplyDecodedDelta,
      showToast,
    }) {
      const modalRef = useRef(null);
      useFocusTrap(isOpen, modalRef);
      const backdropDismiss = useBackdropDismiss(onClose);

      const [tab, setTab] = useState('cloud'); // 'cloud' | 'p2p'
      const [webhookUrl, setWebhookUrl] = useState(syncConfig?.webhookUrl || '');
      const [syncSecret, setSyncSecret] = useState(syncConfig?.syncSecret || '');
      const [showSetupGuide, setShowSetupGuide] = useState(false);
      const [showPairQr, setShowPairQr] = useState(false);
      const [testResult, setTestResult] = useState(null);
      const [isTesting, setIsTesting] = useState(false);

      // Вкладка P2P-дельты
      const [deltaScope, setDeltaScope] = useState('since'); // 'since' | 'full'
      const [outgoingToken, setOutgoingToken] = useState('');
      const [outgoingSummary, setOutgoingSummary] = useState(null);
      const [showDeltaQr, setShowDeltaQr] = useState(false);
      const [incomingInput, setIncomingInput] = useState('');
      const [incomingPreview, setIncomingPreview] = useState(null);
      const [incomingError, setIncomingError] = useState('');

      useEffect(() => {
        if (!isOpen) return;
        setTestResult(null);
        setIncomingError('');

        if (pendingIncomingPair) {
          setTab('cloud');
          setWebhookUrl(pendingIncomingPair.webhookUrl || '');
          setSyncSecret(pendingIncomingPair.syncSecret || '');
          setShowSetupGuide(false);
        } else {
          setWebhookUrl(syncConfig?.webhookUrl || '');
          setSyncSecret(syncConfig?.syncSecret || generateRandomSyncSecret());
        }

        if (pendingIncomingDeltaToken) {
          setTab('p2p');
          setIncomingInput(pendingIncomingDeltaToken);
        } else {
          setIncomingInput('');
          setIncomingPreview(null);
        }

        setOutgoingToken('');
        setOutgoingSummary(null);
        setShowDeltaQr(false);
        setShowPairQr(false);
      }, [isOpen, syncConfig, pendingIncomingPair, pendingIncomingDeltaToken]);

      // Авто-предпросмотр входящей дельты
      useEffect(() => {
        let cancelled = false;
        const raw = incomingInput.trim();
        if (!raw) {
          setIncomingPreview(null);
          setIncomingError('');
          return;
        }

        decodeDeltaPacket(raw)
          .then((delta) => {
            if (cancelled) return;
            const txsCount = (delta.entities?.transactions || []).length;
            const otherCount =
              (delta.entities?.goals || []).length +
              (delta.entities?.recurringPayments || []).length +
              (delta.entities?.debts || []).length +
              (delta.entities?.customCategories || []).length;
            const delCount = (delta.tombstones || []).length;
            setIncomingPreview({ delta, txsCount, otherCount, delCount });
            setIncomingError('');
          })
          .catch((err) => {
            if (cancelled) return;
            setIncomingPreview(null);
            setIncomingError(err?.message || 'Не удалось распознать код синхронизации');
          });

        return () => {
          cancelled = true;
        };
      }, [incomingInput]);

      if (!isOpen) return null;

      const isUrlValid = isValidGasWebhookUrl(webhookUrl);
      const canCloudSync = isUrlValid && syncSecret.trim().length >= 4;

      const buildPairShareString = () => {
        const token = encodePairingPayload({ webhookUrl, syncSecret });
        const base = getShareBaseUrl();
        return base ? `${base}?pair=${encodeURIComponent(token)}` : token;
      };

      const pairQrResult = showPairQr && canCloudSync ? encodeQrMatrix(buildPairShareString()) : null;
      const deltaQrResult = showDeltaQr && outgoingToken ? encodeQrMatrix(outgoingToken) : null;

      const handleSaveAndSync = async (e) => {
        e?.preventDefault();
        const cfg = { webhookUrl: webhookUrl.trim(), syncSecret: syncSecret.trim() };
        onSaveSyncConfig(cfg);
        if (pendingIncomingPair) onClearPendingPair();
        await onSyncNow(cfg);
      };

      const handleTest = async () => {
        setIsTesting(true);
        setTestResult(null);
        try {
          const res = await onTestConnection({ webhookUrl: webhookUrl.trim(), syncSecret: syncSecret.trim() });
          setTestResult({ ok: true, msg: `Связь работает! Записей в таблице: ${res.recordsCount ?? 0}` });
          onSaveSyncConfig({ webhookUrl: webhookUrl.trim(), syncSecret: syncSecret.trim() });
        } catch (err) {
          setTestResult({ ok: false, msg: err?.message || 'Ошибка соединения' });
        } finally {
          setIsTesting(false);
        }
      };

      const handleCopyGasScript = async () => {
        const code = generateGasCodeScript(syncSecret.trim() || 'fb-family-secret');
        await copyTextToClipboard(code);
        showToast('Код Google Apps Script (Code.gs) скопирован в буфер!');
      };

      const handleSharePairing = async () => {
        const link = buildPairShareString();
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'Подключение Семейного Бюджета',
              text: 'Откройте ссылку, чтобы подключить телефон к нашему семейному бюджету:',
              url: link,
            });
            return;
          } catch {
            // Пользователь отменил или Web Share недоступен — копируем
          }
        }
        await copyTextToClipboard(link);
        showToast('Ссылка подключения второго телефона скопирована!');
      };

      const handleBuildAndShareDelta = async (shareViaSystem = false) => {
        const since = deltaScope === 'since' ? lastSyncAt : null;
        const delta = buildSyncDelta(localState, since);
        const token = await encodeDeltaPacket(delta);
        const base = getShareBaseUrl();
        const payloadStr = base ? `${base}?sync=${encodeURIComponent(token)}` : token;

        setOutgoingToken(payloadStr);
        setOutgoingSummary({
          txs: (delta.entities?.transactions || []).length,
          others:
            (delta.entities?.goals || []).length +
            (delta.entities?.recurringPayments || []).length +
            (delta.entities?.debts || []).length +
            (delta.entities?.customCategories || []).length,
          tombstones: (delta.tombstones || []).length,
          bytes: new TextEncoder().encode(payloadStr).length,
        });

        if (shareViaSystem && navigator.share && base) {
          try {
            await navigator.share({
              title: 'Обновление Семейного Бюджета',
              text: 'Новые операции для синхронизации нашего бюджета:',
              url: payloadStr,
            });
            return;
          } catch {
            // Fallback в буфер обмена
          }
        }
        await copyTextToClipboard(payloadStr);
        showToast('Дельта синхронизации скопирована! Отправьте ее супругу в Telegram.');
      };

      const handleApplyIncoming = () => {
        if (!incomingPreview?.delta) return;
        onApplyDecodedDelta(incomingPreview.delta);
        setIncomingInput('');
        setIncomingPreview(null);
        if (pendingIncomingDeltaToken) onClearPendingDeltaToken();
        onClose();
      };

      return (
        <div
          {...backdropDismiss}
          className="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in"
          role="dialog"
          aria-modal="true"
          aria-labelledby="sync-modal-title"
        >
          <div
            ref={modalRef}
            className="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 sm:p-6 shadow-2xl border border-stone-200 max-h-[94vh] overflow-y-auto space-y-4"
          >
            <div className="w-10 h-1 rounded-full bg-stone-300 mx-auto mb-1 sm:hidden shrink-0" />

            <div className="flex items-center justify-between pb-3 border-b border-stone-100">
              <div className="flex items-center gap-2.5">
                <span className="w-8 h-8 rounded-xl bg-stone-900 text-white flex items-center justify-center shrink-0">
                  <RefreshCw className={`w-4 h-4 ${isSyncing ? 'animate-spin' : ''}`} />
                </span>
                <div>
                  <span id="sync-modal-title" className="font-semibold text-stone-900 text-sm block">
                    Синхронизация супругов (FB-10)
                  </span>
                  <span className="text-[11px] text-stone-500">
                    {lastSyncAt
                      ? `Последний синк: ${new Date(lastSyncAt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}`
                      : 'Синхронизация еще не проводилась'}
                  </span>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Закрыть окно синхронизации"
                className="w-8 h-8 flex items-center justify-center text-stone-500 hover:text-stone-900 hover:bg-stone-100 rounded-xl transition"
              >
                <X className="w-4 h-4" />
              </button>
            </div>

            {/* Переключатель вкладок */}
            <div className="grid grid-cols-2 gap-1 bg-stone-100 p-1 rounded-xl h-10 text-xs font-semibold">
              <button
                type="button"
                onClick={() => setTab('cloud')}
                className={`h-8 rounded-lg transition flex items-center justify-center gap-1.5 ${
                  tab === 'cloud' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-600 hover:text-stone-900'
                }`}
              >
                <Cloud className="w-3.5 h-3.5" />
                <span>Google Таблица</span>
              </button>
              <button
                type="button"
                onClick={() => setTab('p2p')}
                className={`h-8 rounded-lg transition flex items-center justify-center gap-1.5 ${
                  tab === 'p2p' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-600 hover:text-stone-900'
                }`}
              >
                <Share2 className="w-3.5 h-3.5" />
                <span>Ссылка / QR</span>
              </button>
            </div>

            {tab === 'cloud' ? (
              <form onSubmit={handleSaveAndSync} className="space-y-4">
                {pendingIncomingPair && (
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-950 space-y-1">
                    <div className="font-bold">Получены настройки с телефона партнера!</div>
                    <p className="text-[11px] text-emerald-800">
                      Нажмите «Синхронизировать сейчас», чтобы подключиться к общей Google Таблице и объединить базы.
                    </p>
                  </div>
                )}

                {hasUnsyncedChanges && canCloudSync && (
                  <div className="p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 flex items-center gap-2">
                    <AlertCircle className="w-4 h-4 text-amber-700 shrink-0" />
                    <span>Есть локальные изменения с момента последнего синка. Нажмите «Синхронизировать сейчас».</span>
                  </div>
                )}

                {syncError && (
                  <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800">
                    Ошибка синка: {syncError}
                  </div>
                )}

                <div className="space-y-3 p-3.5 bg-stone-50 rounded-xl border border-stone-200/80">
                  <div>
                    <label className="text-xs font-semibold text-stone-700 block mb-1">
                      URL веб-приложения Google Apps Script
                    </label>
                    <input
                      type="url"
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={webhookUrl}
                      onChange={(e) => setWebhookUrl(e.target.value)}
                      className="w-full h-9 text-xs font-mono px-3 bg-white border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-900 text-stone-900"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-xs font-semibold text-stone-700">
                        Секретный ключ семьи (SYNC_SECRET)
                      </label>
                      <button
                        type="button"
                        onClick={() => setSyncSecret(generateRandomSyncSecret())}
                        className="text-[11px] font-semibold text-stone-600 hover:text-stone-900 underline"
                      >
                        Сгенерировать
                      </button>
                    </div>
                    <input
                      type="text"
                      placeholder="Минимум 4 символа"
                      value={syncSecret}
                      onChange={(e) => setSyncSecret(e.target.value)}
                      className="w-full h-9 text-xs font-mono px-3 bg-white border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-900 text-stone-900"
                    />
                  </div>

                  {testResult && (
                    <div className={`p-2.5 rounded-lg text-xs font-medium ${
                      testResult.ok ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'
                    }`}>
                      {testResult.msg}
                    </div>
                  )}

                  <div className="flex items-center gap-2 pt-1">
                    <button
                      type="button"
                      disabled={!canCloudSync || isTesting}
                      onClick={handleTest}
                      className="h-10 px-3 rounded-xl bg-white border border-stone-200 hover:bg-stone-100 disabled:opacity-50 text-xs font-semibold text-stone-700 transition shrink-0"
                    >
                      {isTesting ? 'Проверка...' : 'Проверить'}
                    </button>
                    <button
                      type="submit"
                      disabled={!canCloudSync || isSyncing}
                      className="flex-1 h-10 bg-stone-900 hover:bg-stone-800 disabled:opacity-50 text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <RefreshCw className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`} />
                      <span>{isSyncing ? 'Синхронизация...' : 'Синхронизировать сейчас'}</span>
                    </button>

                    <div className="flex items-center justify-between gap-2">
                      <div>
                        <span className="text-xs font-bold text-indigo-950 block">Подключить второй телефон</span>
                        <span className="text-[11px] text-indigo-800">Передайте настройки супругу без ручного ввода URL</span>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={handleSharePairing}
                        className="flex-1 h-9 px-3 bg-white border border-indigo-200 hover:bg-indigo-100/60 text-indigo-900 rounded-lg text-xs font-semibold transition inline-flex items-center justify-center gap-1.5"
                      >
                        <Share2 className="w-3.5 h-3.5" />
                        <span>Отправить ссылку</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setShowPairQr(!showPairQr)}
                        className="h-9 px-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition inline-flex items-center justify-center gap-1.5 shrink-0"
                      >
                        <QrCode className="w-3.5 h-3.5" />
                        <span>{showPairQr ? 'Скрыть QR' : 'QR-код'}</span>
                      </button>
                    </div>
                    {showPairQr && pairQrResult?.ok && (
                      <div className="p-3 bg-white rounded-xl border border-indigo-100 flex flex-col items-center gap-2 animate-fade-in">
                        <svg
                          viewBox={`0 0 ${pairQrResult.size + 4} ${pairQrResult.size + 4}`}
                          className="w-44 h-44 bg-white"
                          shapeRendering="crispEdges"
                          aria-label="QR-код для подключения второго телефона"
                        >

      onClose,
      initialTx,

      currentUser,
      userProfiles,

      customCategories,
      onCreateCustomCategory,

      const [selectedCategory, setSelectedCategory] = useState(DEFAULT_EXPENSE_CATEGORIES[0].name);
      const [selectedAccount, setSelectedAccount] = useState('shared');
      const [txAuthor, setTxAuthor] = useState('husband');
      const [transferTo, setTransferTo] = useState('shared');
      const [txDate, setTxDate] = useState(getLocalDateString);
      const [isBatchReceiptMode, setIsBatchReceiptMode] = useState(false);
      const [isOpeningBalance, setIsOpeningBalance] = useState(false);

      const [newCatIcon, setNewCatIcon] = useState('🏷️');
      const [newCatBucket, setNewCatBucket] = useState('base');

      const p1Name = userProfiles?.husband?.name || 'Партнер 1';
      const p1Emoji = userProfiles?.husband?.emoji || '🧔🏻‍♂️';
      const p2Name = userProfiles?.wife?.name || 'Партнер 2';
      const p2Emoji = userProfiles?.wife?.emoji || '👩🏼';

        if (wKey === 'wife') return `${p2Emoji} ${p2Name}`;
        return '👥 Общий котел (Резерв)';

      const currentFromWallet = selectedAccount === 'shared' ? 'shared' : (txAuthor === 'wife' ? 'wife' : 'husband');

      const setFromWalletKey = (wKey) => {
        if (wKey === 'shared') {
          setSelectedAccount('shared');
          setTxAuthor(currentUser);
          if (transferTo === 'shared') {
            setTransferTo(currentUser === 'wife' ? 'wife' : 'husband');
          }
        } else {
          setSelectedAccount('personal');
          setTxAuthor(wKey);
          if (transferTo === wKey) {
            setTransferTo('shared');
          }
        }
      };

      const setToWalletKey = (wKey) => {
        if (wKey === currentFromWallet) {
          const fallbackFrom = wKey === 'shared' ? (currentUser === 'wife' ? 'wife' : 'husband') : 'shared';
          setFromWalletKey(fallbackFrom);
        }
        setTransferTo(wKey);

      useEffect(() => {
        if (!isOpen) return;
        if (initialTx) {
          setAmount(String(initialTx.amount));
          setTxTitle(initialTx.title === initialTx.category ? '' : initialTx.title);
          setTxType(initialTx.type || 'expense');
          setSelectedCategory(initialTx.category || DEFAULT_EXPENSE_CATEGORIES[0].name);
          setSelectedAccount(initialTx.account || 'shared');
          setTxAuthor(initialTx.author || currentUser);
          setTransferTo(initialTx.transferTo || 'shared');
          setTxDate(initialTx.date || getLocalDateString());
          setIsOpeningBalance(Boolean(initialTx.isOpeningBalance));
        } else {
          setAmount('');
          setTxTitle('');
          const initType = presetConfig?.type || 'expense';
          setTxType(initType);
          setSelectedCategory(DEFAULT_EXPENSE_CATEGORIES[0].name);
          const initAcc = presetConfig?.account || (initType === 'transfer' ? 'personal' : 'shared');
          const initAuth = presetConfig?.author || currentUser;
          setSelectedAccount(initAcc);
          setTxAuthor(initAuth);
          const fromW = initAcc === 'shared' ? 'shared' : (initAuth === 'wife' ? 'wife' : 'husband');
          setTransferTo(presetConfig?.transferTo || (fromW === 'shared' ? (currentUser === 'wife' ? 'wife' : 'husband') : 'shared'));
          setTxDate(presetConfig?.date || getLocalDateString());
          setIsBatchReceiptMode(Boolean(presetConfig?.batchMode));
          setIsOpeningBalance(Boolean(presetConfig?.isOpeningBalance));
        }
        setIsAddingCustomCategory(false);
        setIsManagingCategories(false);
      }, [isOpen, initialTx, presetConfig, currentUser]);

      const activeCategories = useMemo(() => {
        if (txType === 'income') {
          return [...DEFAULT_INCOME_CATEGORIES, ...customCategories.filter(c => c.type === 'income')];
        }
        return [...DEFAULT_EXPENSE_CATEGORIES, ...customCategories.filter(c => c.type !== 'income')];
      }, [txType, customCategories]);

      if (!isOpen) return null;

      const handleTypeSwitch = (newType) => {
        if (isLockedType) return;
        setTxType(newType);
        setIsAddingCustomCategory(false);
        if (newType === 'transfer') {
          setIsOpeningBalance(false);
          const fromW = selectedAccount === 'shared' ? 'shared' : (txAuthor === 'wife' ? 'wife' : 'husband');
          if (fromW === 'shared' && transferTo === 'shared') {
            setSelectedAccount('personal');
            setTxAuthor(currentUser);
            setTransferTo('shared');
          } else if (fromW === transferTo) {
            setTransferTo(fromW === 'shared' ? (currentUser === 'wife' ? 'wife' : 'husband') : 'shared');
          }
          return;
        }
        if (newType === 'income') {
          const exists = [...DEFAULT_INCOME_CATEGORIES, ...customCategories.filter(c => c.type === 'income')].some(c => c.name === selectedCategory);
          if (!exists) setSelectedCategory(DEFAULT_INCOME_CATEGORIES[0].name);
        } else {
          const exists = [...DEFAULT_EXPENSE_CATEGORIES, ...customCategories.filter(c => c.type !== 'income')].some(c => c.name === selectedCategory);
          if (!exists) setSelectedCategory(DEFAULT_EXPENSE_CATEGORIES[0].name);
        }
      };

      const handleAddCategory = (e) => {
        e?.preventDefault();
        const trimmed = newCatName.trim();
        if (!trimmed) return;
        onCreateCustomCategory({
          name: trimmed,
          icon: newCatIcon.trim() || (txType === 'income' ? '💵' : '🏷️'),
          type: txType,
          bucket: txType === 'income' ? 'income' : newCatBucket,
        });
        setSelectedCategory(trimmed);
        setNewCatName('');
        setIsAddingCustomCategory(false);
      };

      const submitForm = (e, keepOpenOverride = false) => {

        const num = parseFloat(amount);

        if (txType === 'transfer') {
          const fromW = currentFromWallet;
          const toW = transferTo === fromW ? (fromW === 'shared' ? 'husband' : 'shared') : transferTo;
          const autoTransferTitle = `${getWalletLabel(fromW)} → ${getWalletLabel(toW)}`;
          onSaveTransaction({
            id: initialTx?.id || null,
            amount: num,
            title: txTitle.trim() || autoTransferTitle,
            type: 'transfer',
            category: 'Перевод между счетами',
            account: fromW === 'shared' ? 'shared' : 'personal',
            author: fromW === 'shared' ? currentUser : fromW,
            fromWallet: fromW,
            transferTo: toW,
            date: txDate || getLocalDateString(),
            stayOpen,

          onSaveTransaction({
            id: initialTx?.id || null,
            amount: num,
            title: txTitle.trim() || defaultTitle,
            type: txType,
            category: finalCategory,
            account: selectedAccount,
            author: txAuthor,
            isOpeningBalance: Boolean(isOpeningBalance),
            date: txDate || getLocalDateString(),
            stayOpen,
          });

          setAmount('');
          setTxTitle('');
        }
      };

                  {initialTx ? 'Редактирование операции' : 'Запись расхода / дохода / перевода'}
                </span>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Закрыть модальное окно"

                  } ${isLockedType ? 'cursor-not-allowed opacity-80' : ''}`}
                >
                  Доход (+)

              <div className="space-y-2">

      deviceOwner,
      safeLimitConfig,
      onComplete,
    }) {
      const modalRef = useRef(null);
      useFocusTrap(isOpen, modalRef);
      const backdropDismiss = useBackdropDismiss(onClose);

      const [step, setStep] = useState(1);
      const [p1Name, setP1Name] = useState(userProfiles?.husband?.name || 'Партнер 1');

      const [p2Emoji, setP2Emoji] = useState(userProfiles?.wife?.emoji || '👩🏼');
      const [owner, setOwner] = useState(deviceOwner || 'husband');

      const [myStartBalance, setMyStartBalance] = useState('');
      const [partnerStartBalance, setPartnerStartBalance] = useState('');
      const [sharedStartBalance, setSharedStartBalance] = useState('');
      const [startDate, setStartDate] = useState(getLocalDateString);
      const [payday1, setPayday1] = useState(String(safeLimitConfig?.paydays?.[0] ?? 10));
      const [payday2, setPayday2] = useState(String(safeLimitConfig?.paydays?.[1] ?? 25));

      useEffect(() => {
        if (!isOpen) return;
        setStep(1);
        setP1Name(userProfiles?.husband?.name && userProfiles.husband.name !== 'Партнер 1' ? userProfiles.husband.name : '');
        setP1Emoji(userProfiles?.husband?.emoji || '🧔🏻‍♂️');
        setP2Name(userProfiles?.wife?.name && userProfiles.wife.name !== 'Партнер 2' ? userProfiles.wife.name : '');
        setP2Emoji(userProfiles?.wife?.emoji || '👩🏼');
        setOwner(deviceOwner || 'husband');
        setMyStartBalance('');
        setPartnerStartBalance('');
        setSharedStartBalance('');
        setStartDate(getLocalDateString());
        setPayday1(String(safeLimitConfig?.paydays?.[0] ?? 10));
        setPayday2(String(safeLimitConfig?.paydays?.[1] ?? 25));
      }, [isOpen, userProfiles, deviceOwner, safeLimitConfig]);

      if (!isOpen) return null;

      const cleanP1 = p1Name.trim() || 'Партнер 1';
      const cleanP2 = p2Name.trim() || 'Партнер 2';
      const myLabel = owner === 'wife' ? `${p2Emoji} ${cleanP2}` : `${p1Emoji} ${cleanP1}`;
      const partnerLabel = owner === 'wife' ? `${p1Emoji} ${cleanP1}` : `${p2Emoji} ${cleanP2}`;

      const handleFinish = (e) => {
        e.preventDefault();
        const myVal = parseFloat(myStartBalance) || 0;
        const partnerVal = parseFloat(partnerStartBalance) || 0;
        const sharedVal = parseFloat(sharedStartBalance) || 0;

        const paydays = [];
        const d1 = Number(payday1);
        const d2 = Number(payday2);
        if (d1 >= 1 && d1 <= 31) paydays.push(d1);
        if (d2 >= 1 && d2 <= 31 && d2 !== d1) paydays.push(d2);
        if (paydays.length === 0) paydays.push(10, 25);

        onComplete({
          userProfiles: {
            husband: { id: 'husband', name: cleanP1, emoji: p1Emoji, color: 'blue' },
            wife: { id: 'wife', name: cleanP2, emoji: p2Emoji, color: 'rose' },
          },
          deviceOwner: owner,
          paydays: paydays.sort((a, b) => a - b),
          startDate: startDate || getLocalDateString(),
          balances: {
            husband: owner === 'husband' ? myVal : partnerVal,
            wife: owner === 'wife' ? myVal : partnerVal,
            shared: sharedVal,
          },
        });
      };

      return (
        <div

                className="w-8 h-8 flex items-center justify-center text-stone-500 hover:text-stone-900 hover:bg-stone-100 rounded-xl transition"
              >
                <X className="w-4 h-4" />
              </button>
            </div>

            {/* Индикатор шага */}
            <div className="grid grid-cols-2 gap-1.5 pt-3">
              <div className={`h-1.5 rounded-full transition ${step >= 1 ? 'bg-stone-900' : 'bg-stone-200'}`} />

            </div>

            {step === 1 ? (
              <div className="pt-4 space-y-4">
                <div className="p-3.5 bg-stone-50 rounded-xl border border-stone-200/80 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-stone-900">Партнер 1</span>
                    <span className="text-lg">{p1Emoji}</span>
                  </div>
                  <input
                    type="text"
                    placeholder="Имя (например: Алексей)"
                    autoFocus
                    value={p1Name}
                    onChange={(e) => setP1Name(e.target.value)}
                    className="w-full h-9 text-xs font-semibold px-3 bg-white border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-stone-900 text-stone-900"
                  />
                  <div className="flex gap-1.5 flex-wrap">
                    {QUICK_USER_AVATARS.slice(0, 8).map(av => (
                      <button
                        key={av}
                        type="button"
                        onClick={() => setP1Emoji(av)}
                        className={`w-7 h-7 rounded-lg text-xs flex items-center justify-center border transition ${
                          p1Emoji === av ? 'border-stone-900 bg-stone-200 font-bold' : 'border-stone-200 bg-white hover:bg-stone-100'
                        }`}
                      >
                        {av}
                      </button>
                    ))}

                </div>

                <div className="p-3.5 bg-stone-50 rounded-xl border border-stone-200/80 space-y-2.5">

      // Система мягких уведомлений и отмены удаления (Undo Toast)

      const handleStorageQuotaError = useCallback(() => {

      // Сохранение в LocalStorage с защитой от переполнения квоты

      useEffect(() => {
        saveToStorage('family_budget_settings_sync_meta', settingsSyncMeta, handleStorageQuotaError);
      }, [settingsSyncMeta, handleStorageQuotaError]);

      // Перехват входящей ссылки подключения (?pair=...) или P2P-дельты (?sync=...) при открытии URL
      useEffect(() => {
        if (typeof window === 'undefined' || !window.location?.search) return;
        const params = new URLSearchParams(window.location.search);
        const pairRaw = params.get('pair');
        const syncRaw = params.get('sync');
        if (!pairRaw && !syncRaw) return;

        if (pairRaw) {
          try {
            const pair = decodePairingPayload(pairRaw);

            setIsSyncModalOpen(true);
          } catch (err) {
            showToast(err?.message || 'Не удалось прочитать ссылку подключения');
          }
        }
        if (syncRaw) {
          setPendingIncomingDeltaToken(syncRaw);
          setIsSyncModalOpen(true);
        }

        params.delete('pair');
        params.delete('sync');
        const qs = params.toString();
        const cleanUrl = `${window.location.pathname}${qs ? '?' + qs : ''}${window.location.hash || ''}`;
        window.history.replaceState({}, document.title, cleanUrl);
      }, [showToast]);

      // Закрытие модальных окон по Escape
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setIsAddModalOpen(false);

            setIsNewGoalModalOpen(false);
            setIsNewRecurringModalOpen(false);

            setIsNewDebtModalOpen(false);

            setIsOnboardingModalOpen(false);
            setIsSyncModalOpen(false);
          }
